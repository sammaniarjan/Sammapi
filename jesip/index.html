<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>JESIP-trainer</title>
<meta name="description" content="Interactieve lesmodule over JESIP en MIMS: majorincident-doctrine, M/ETHANE en het Joint Decision Model. Voor onderwijsdoeleinden.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e2d9cc'/><circle cx='38' cy='42' r='18' fill='none' stroke='%234f46e5' stroke-width='7'/><circle cx='62' cy='42' r='18' fill='none' stroke='%23c45a3c' stroke-width='7'/><circle cx='50' cy='62' r='18' fill='none' stroke='%232c3e36' stroke-width='7'/></svg>">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #e2d9cc;
    --vlak: #ffffff;
    --vlak-zacht: #f7f3ed;
    --tekst: #2c3e36;
    --tekst-2: #6b7b6f;
    --muted: #9aa69e;
    --rand: #d5cdc2;
    --rand-licht: #e3dbd0;
    --accent: #4f46e5;
    --accent-donker: #4338ca;
    --accent-bg: rgba(79, 70, 229, 0.08);
    --groen: #059669;
    --groen-bg: rgba(5, 150, 105, 0.1);
    --oranje: #d97706;
    --rood: #dc2626;
    --rood-bg: rgba(220, 38, 38, 0.08);
}

body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--tekst);
    line-height: 1.55;
    min-height: 100vh;
}

.wrap { max-width: 680px; margin: 0 auto; padding: 16px 16px 60px; }

.back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--tekst-2); text-decoration: none;
    font-size: 0.88rem; padding: 10px 0;
}
.back-link:hover { color: var(--accent); }
.back-link svg { width: 17px; height: 17px; }

.app-head { margin: 8px 0 18px; }
.app-head h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem; font-weight: 600;
}
.app-head .sub { color: var(--tekst-2); font-size: 0.88rem; }

.card {
    background: var(--vlak);
    border: 1px solid var(--rand-licht);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
}
.card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem; font-weight: 600; margin-bottom: 10px;
}
.card p { font-size: 0.92rem; margin-bottom: 8px; }
.card p:last-child { margin-bottom: 0; }
.card ul, .card ol { margin: 6px 0 10px 20px; font-size: 0.92rem; }
.card li { margin-bottom: 4px; }
.zacht { color: var(--tekst-2); font-size: 0.85rem; }

.quote {
    background: var(--vlak-zacht);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    margin: 10px 0;
    font-size: 0.92rem;
    font-style: italic;
}
.mono { font-family: 'JetBrains Mono', monospace; font-size: 0.86em; }

table.mini { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.87rem; }
table.mini td, table.mini th { padding: 6px 8px; border-bottom: 1px solid var(--rand-licht); text-align: left; vertical-align: top; }
table.mini th { color: var(--tekst-2); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.4px; }
table.mini td:first-child { font-weight: 700; white-space: nowrap; }

/* ------- moduleoverzicht ------- */
.intro-note {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--accent-bg);
    border: 1px solid rgba(79, 70, 229, 0.2);
    border-radius: 12px; padding: 12px 14px;
    font-size: 0.86rem; margin-bottom: 16px;
}
.intro-note svg { flex-shrink: 0; margin-top: 2px; }

.mod-lijst { display: flex; flex-direction: column; gap: 10px; }
.mod-item {
    display: grid; grid-template-columns: 34px 1fr auto;
    gap: 12px; align-items: center;
    background: var(--vlak);
    border: 1px solid var(--rand-licht);
    border-radius: 12px; padding: 13px 16px;
    cursor: pointer; text-align: left;
    font: inherit; color: inherit; width: 100%;
    transition: all 0.2s;
}
.mod-item:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(44, 62, 54, 0.08); border-color: #c4b8aa; }
.mod-nr {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--vlak-zacht); border: 1px solid var(--rand);
    font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; font-weight: 700;
    color: var(--tekst-2);
}
.mod-item.af .mod-nr { background: var(--groen-bg); border-color: rgba(5, 150, 105, 0.35); color: var(--groen); }
.mod-titel { font-weight: 600; font-size: 0.93rem; }
.mod-sub { font-size: 0.78rem; color: var(--tekst-2); }
.mod-score {
    font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
    color: var(--muted); white-space: nowrap;
}
.mod-item.af .mod-score { color: var(--groen); font-weight: 700; }

.mod-item.special { border-style: dashed; }
.mod-item.special .mod-nr { background: var(--accent-bg); border-color: rgba(79, 70, 229, 0.3); color: var(--accent); }

.voortgang-balkje {
    height: 6px; border-radius: 4px; background: var(--rand-licht);
    overflow: hidden; margin: 6px 0 2px;
}
.voortgang-balkje > div { height: 100%; background: var(--groen); border-radius: 4px; transition: width 0.5s; }

/* ------- oefenscherm ------- */
.oefen-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.oefen-top .stop {
    font: inherit; font-size: 0.8rem; color: var(--tekst-2);
    background: none; border: 1px solid var(--rand); border-radius: 50px;
    padding: 5px 13px; cursor: pointer;
}
.oefen-top .stop:hover { border-color: var(--rood); color: var(--rood); }
.balk { flex: 1; height: 8px; border-radius: 4px; background: rgba(44, 62, 54, 0.1); overflow: hidden; }
.balk > div { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s ease; }

.item-kaart {
    background: var(--vlak);
    border: 1px solid var(--rand-licht);
    border-radius: 14px;
    padding: 20px;
    animation: verschijn 0.35s ease;
}
@keyframes verschijn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.item-label {
    display: inline-block; font-size: 0.68rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--accent); background: var(--accent-bg);
    padding: 3px 10px; border-radius: 50px; margin-bottom: 12px;
}
.item-label.herhaal { color: var(--oranje); background: rgba(217, 119, 6, 0.1); }
.vraag-tekst { font-size: 1.02rem; font-weight: 600; margin-bottom: 14px; }

.opties { display: flex; flex-direction: column; gap: 8px; }
.optie {
    font: inherit; font-size: 0.9rem; text-align: left;
    background: var(--vlak-zacht); color: var(--tekst);
    border: 1px solid var(--rand); border-radius: 10px;
    padding: 11px 14px; cursor: pointer; transition: all 0.15s;
}
.optie:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-bg); }
.optie:disabled { cursor: default; }
.optie.goed { background: var(--groen-bg); border-color: var(--groen); color: var(--groen); font-weight: 600; }
.optie.fout { background: var(--rood-bg); border-color: var(--rood); color: var(--rood); }
.optie.gemist { border-color: var(--groen); border-style: dashed; color: var(--groen); }
.optie.gekozen { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip {
    font: inherit; font-size: 0.86rem; font-weight: 500;
    background: var(--vlak-zacht); border: 1px solid var(--rand);
    border-radius: 50px; padding: 8px 15px; cursor: pointer; transition: all 0.15s;
}
.chip:hover:not(:disabled) { border-color: var(--accent); }
.chip:disabled { opacity: 0.35; cursor: default; }
.volg-lijst { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; min-height: 20px; }
.volg-rij {
    display: flex; align-items: center; gap: 10px;
    background: var(--vlak-zacht); border: 1px solid var(--rand);
    border-radius: 10px; padding: 8px 12px; font-size: 0.9rem; cursor: pointer;
}
.volg-rij .nr { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; font-weight: 700; color: var(--tekst-2); width: 18px; }
.volg-rij.goed { border-color: var(--groen); background: var(--groen-bg); cursor: default; }
.volg-rij.fout { border-color: var(--rood); background: var(--rood-bg); cursor: default; }

.koppel-kolommen { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.koppel-links .chip { font-family: 'JetBrains Mono', monospace; font-weight: 700; width: 100%; }
.koppel-kolommen > div { display: flex; flex-direction: column; gap: 8px; }
.koppel-kolommen .chip { text-align: left; border-radius: 10px; }
.chip.actief { border-color: var(--accent); background: var(--accent-bg); }
.chip.vast { border-color: var(--groen); background: var(--groen-bg); color: var(--groen); cursor: default; }
.chip.schud { animation: schud 0.35s; border-color: var(--rood); }
@keyframes schud { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.sorteer-item {
    background: var(--vlak-zacht); border: 1px solid var(--rand);
    border-radius: 10px; padding: 14px; font-size: 0.95rem; font-weight: 600;
    text-align: center; margin-bottom: 12px;
}
.sorteer-knoppen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sorteer-knoppen .optie { text-align: center; font-weight: 600; }
.sorteer-telling { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 10px; font-family: 'JetBrains Mono', monospace; }

.feedback {
    margin-top: 14px; border-radius: 10px; padding: 12px 14px;
    font-size: 0.88rem; animation: verschijn 0.3s ease;
}
.feedback.ok { background: var(--groen-bg); border: 1px solid rgba(5, 150, 105, 0.3); }
.feedback.nee { background: var(--rood-bg); border: 1px solid rgba(220, 38, 38, 0.25); }
.feedback .kop { font-weight: 700; margin-bottom: 4px; }
.feedback.ok .kop { color: var(--groen); }
.feedback.nee .kop { color: var(--rood); }

.knop {
    font: inherit; font-size: 0.92rem; font-weight: 600;
    background: var(--accent); color: #fff;
    border: none; border-radius: 10px;
    padding: 11px 22px; cursor: pointer; transition: all 0.2s;
}
.knop:hover { background: var(--accent-donker); }
.knop:disabled { opacity: 0.4; cursor: default; }
.knop.rustig { background: transparent; color: var(--tekst-2); border: 1px solid var(--rand); }
.knop.rustig:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
.knop-rij { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

.flits-antwoord {
    background: var(--vlak-zacht); border: 1px solid var(--rand);
    border-radius: 10px; padding: 14px; font-size: 0.9rem; margin-top: 12px;
    animation: verschijn 0.3s ease;
}

/* ------- klaar-scherm ------- */
.klaar-kop { text-align: center; padding: 10px 0 4px; }
.klaar-kop .cijfer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.6rem; font-weight: 700; line-height: 1.2;
}
.klaar-kop .cijfer.top { color: var(--groen); }
.klaar-kop .cijfer.matig { color: var(--oranje); }
.klaar-kop .cijfer.laag { color: var(--rood); }
.klaar-kop .toelichting { color: var(--tekst-2); font-size: 0.9rem; margin-top: 4px; }
.fout-lijstje { margin-top: 14px; }
.fout-lijstje .rij {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 0; border-top: 1px solid var(--rand-licht); font-size: 0.86rem;
}
.fout-lijstje .rij svg { flex-shrink: 0; margin-top: 3px; }

.voet {
    text-align: center; margin-top: 30px;
    font-size: 0.78rem; color: var(--muted);
}
.voet a { color: var(--tekst-2); }

@media (max-width: 520px) {
    .sorteer-knoppen { grid-template-columns: 1fr; }
    .koppel-kolommen { grid-template-columns: 1fr; }
}
</style>
</head>

    <div class="app-head">
        <h1>JESIP-trainer</h1>
        <div class="sub">Joint Emergency Services Interoperability Principles &middot; MIMS-module</div>
    </div>
    <div id="app"></div>
    <div class="voet">Persoonlijk studieproject, geen offici&euml;le uitgave. Gebaseerd op de JESIP Joint Doctrine (VK).</div>
</div>

<script>
'use strict';

/* ============================================================
   Didactische opzet:
   - korte leerblokken, direct gevolgd door ophaal-oefeningen
     (retrieval practice / testing effect)
   - directe, uitleggende feedback bij elk antwoord
   - fout beantwoorde items komen dezelfde sessie terug
   - eindtoets mengt vragen uit alle modules (interleaving)
   - zelftest met open vragen en zelfbeoordeling
   ============================================================ */

const OPSLAG = 'jesip-voortgang';

function laadVoortgang() {
    try { return JSON.parse(localStorage.getItem(OPSLAG)) || {}; } catch (e) { return {}; }
}
function bewaarVoortgang(v) {
    try { localStorage.setItem(OPSLAG, JSON.stringify(v)); } catch (e) {}
}
function schud(a) {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
}

/* ---------------- inhoud ---------------- */

const MODULES = [
{
    id: 'waarom', titel: 'Waarom JESIP bestaat', sub: 'Aanleiding en doel',
    items: [
    { t: 'leer', kop: 'Steeds hetzelfde patroon', html: `
        <p>JESIP staat voor <strong>Joint Emergency Services Interoperability Principles</strong> (VK, opgericht 2012; de Joint Doctrine is inmiddels aan de derde editie toe).</p>
        <p>De aanleiding: onderzoeken naar grote incidenten &mdash; 7/7 (Londen 2005), Lakanal House, Manchester Arena (Kerslake Report), Grenfell Tower &mdash; kwamen telkens tot dezelfde bevindingen. Niet gebrek aan vakmanschap per dienst, maar gebrek aan <em>samenwerking tussen</em> diensten:</p>
        <ul>
            <li>onvoldoende gezamenlijk beeld van de situatie;</li>
            <li>diensten die niet fysiek bij elkaar stonden en langs elkaar heen werkten;</li>
            <li>onbegrepen communicatie: jargon en afkortingen;</li>
            <li>risico-inschattingen die nooit met elkaar werden vergeleken.</li>
        </ul>` },
    { t: 'leer', kop: 'De strapline', html: `
        <p>Dit zinnetje moet je letterlijk kennen. Het is zowel het doel van JESIP als geheel als het doel van het Joint Decision Model:</p>
        <div class="quote">Improving the way we work together when responding to incidents so that we can get better at <strong>working together, saving lives, reducing harm.</strong></div>
        <p class="zacht">Zie je in een antwoordoptie &ldquo;reducing costs&rdquo;, &ldquo;saving reputation&rdquo;, &ldquo;responding quickly&rdquo; of &ldquo;working smartly&rdquo;? Fout. Samenwerken, levens redden, schade beperken &mdash; niets anders.</p>` },
    { t: 'mc', toets: true, vraag: 'Waar staat JESIP voor?',
        opties: [
            { tekst: 'Joint Emergency Services Interoperability Principles', goed: true },
            { tekst: 'Joint Emergency Support and Incident Procedures' },
            { tekst: 'Joint European Safety and Interoperability Programme' },
            { tekst: 'Joint Emergency Services Incident Protocol' }
        ],
        uitleg: 'Interoperability is het kernwoord: het gaat om samenwerking t&uacute;ssen diensten, niet om procedures binnen &eacute;&eacute;n dienst.' },
    { t: 'mc', toets: true, vraag: 'Maak de strapline af: &ldquo;&hellip;so that we can get better at&hellip;&rdquo;',
        opties: [
            { tekst: 'working together, saving lives, reducing harm', goed: true },
            { tekst: 'working together, saving costs, responding quickly' },
            { tekst: 'working smartly, saving lives, protecting reputation' },
            { tekst: 'responding quickly, saving lives, reducing risk' }
        ],
        uitleg: 'Levens en schade zijn de enige metrieken. Kosten, reputatie en snelheid komen in de doctrine niet voor als doel.' },
    { t: 'meer', toets: true, vraag: 'Welke bevindingen kwamen telkens terug in de onderzoeken die tot JESIP leidden? Selecteer alles wat klopt.',
        opties: [
            { tekst: 'Onvoldoende gezamenlijk beeld van de situatie', goed: true },
            { tekst: 'Diensten stonden niet fysiek bij elkaar', goed: true },
            { tekst: 'Communicatie werd niet begrepen door jargon en afkortingen', goed: true },
            { tekst: 'Risico-inschattingen werden nooit met elkaar vergeleken', goed: true },
            { tekst: 'Gebrek aan vakmanschap binnen de afzonderlijke diensten' },
            { tekst: 'Te weinig materieel en mensen ter plaatse' }
        ],
        uitleg: 'De diensten deden hun eigen werk goed; het probleem zat telkens in de samenwerking ertussen. Daarom richt JESIP zich uitsluitend daarop.' }
    ]
},
{
    id: 'major', titel: 'Wat is een major incident?', sub: 'Definitie, standby en declareren',
    items: [
    { t: 'leer', kop: 'De definitie, in drie elementen', html: `
        <div class="quote">An event or situation with a range of serious consequences which requires special arrangements to be implemented by one or more emergency responder agency.</div>
        <table class="mini">
            <tr><td>1</td><td><em>A range of serious consequences</em> &mdash; consequenties in meervoud; breder dan alleen &ldquo;bedreiging voor leven&rdquo;.</td></tr>
            <tr><td>2</td><td><em>Special arrangements</em> &mdash; je treedt buiten de normale werkwijze. Dit is h&eacute;t onderscheidende kenmerk.</td></tr>
            <tr><td>3</td><td><em>One or more agency</em> &mdash; &eacute;&eacute;n dienst is genoeg; het hoeft geen tri-service incident te zijn.</td></tr>
        </table>
        <p class="zacht">Veelgemaakte fout: &ldquo;an event that threatens the stability of the community&hellip;&rdquo; klinkt plausibel, maar dat is de definitie van een <em>civil emergency</em> (Civil Contingencies Act).</p>` },
    { t: 'leer', kop: 'Standby, declared en wie dat mag', html: `
        <ul>
            <li><strong>Standby</strong> &mdash; je vermoedt dat het zich tot een major incident ontwikkelt; diensten bereiden zich voor, de volledige respons wordt nog niet uitgerold.</li>
            <li><strong>Declared</strong> &mdash; de volledige respons komt op gang: vanuit elke emergency service &eacute;n overige responder agencies (lokale overheid, utility companies, HM Coastguard, vrijwilligersorganisaties).</li>
        </ul>
        <p>Wat declareren <strong>niet</strong> doet: het autoriseert geen &ldquo;blue lights&rdquo; (aparte, bestaande bevoegdheid), geeft geen automatische prioriteit boven andere incidenten, en verplicht geen enkele dienst om ter plaatse te komen.</p>
        <p><strong>Iedereen kan declareren</strong> &mdash; ook een individuele responder, zonder minimum rang. Wie declareert, geeft het meteen door via M/ETHANE.</p>` },
    { t: 'mc', toets: true, vraag: 'Welke formulering is de JESIP-definitie van een major incident?',
        opties: [
            { tekst: 'An event or situation with a range of serious consequences which requires special arrangements to be implemented by one or more emergency responder agency', goed: true },
            { tekst: 'An event or situation that threatens the stability of the community and requires special measures' },
            { tekst: 'An event with serious consequences which requires the general resources of two or more emergency services' },
            { tekst: 'An event that threatens life and requires the attendance of all three emergency services' }
        ],
        uitleg: 'Let op de drie elementen: a range of serious consequences, special arrangements, one or more agency. De &ldquo;stability of the community&rdquo;-variant is de definitie van een civil emergency.' },
    { t: 'mc', toets: true, vraag: 'Wie mag een major incident declareren?',
        opties: [
            { tekst: 'Iedere responder, ongeacht rang', goed: true },
            { tekst: 'Alleen de Gold Commander' },
            { tekst: 'Alleen de hoogste officier ter plaatse' },
            { tekst: 'Alleen de control room, op basis van meerdere meldingen' }
        ],
        uitleg: 'Er is geen minimum rang. Wel geldt: wie declareert, geeft het onmiddellijk door via een M/ETHANE-melding.' },
    { t: 'mc', toets: true, vraag: 'Wat gebeurt er als een major incident wordt gedeclareerd?',
        opties: [
            { tekst: 'Het triggert een respons vanuit elke emergency service en overige responder agencies', goed: true },
            { tekst: 'Alle diensten zijn verplicht om ter plaatse te komen' },
            { tekst: 'Het incident krijgt automatisch prioriteit boven alle andere incidenten' },
            { tekst: 'Responders mogen vanaf dat moment met blue lights and sirens rijden' }
        ],
        uitleg: 'De respons is per dienst passend; prioritering blijft een besluit van control rooms en commanders, en optische en geluidssignalen zijn een aparte, altijd al bestaande bevoegdheid.' },
    { t: 'mc', vraag: 'Wat betekent &ldquo;major incident standby&rdquo;?',
        opties: [
            { tekst: 'Je vermoedt dat het zich tot een major incident ontwikkelt; diensten bereiden zich voor, maar de volledige respons wordt niet uitgerold', goed: true },
            { tekst: 'Het major incident is afgeschaald maar kan opnieuw opleven' },
            { tekst: 'Alle diensten staan klaar op een uitgangsstelling tot Gold toestemming geeft' },
            { tekst: 'Een tweede dienst neemt de co&ouml;rdinatie over van de eerste' }
        ],
        uitleg: 'Standby is de voorbereidingsstand: je waarschuwt vast, zodat de opschaling geen koude start is als het toch een declared major incident wordt.' }
    ]

{

    items: [

        <div class="quote">A common understanding of the circumstances, immediate consequences and any possible future consequences, along with an appreciation of the available capabilities and priorities of the responder agencies involved.</div>

    items: [
    { t: 'leer', kop: 'Waarom diensten risico&rsquo;s verschillend zien', html: `
        <p>Diensten zien risico&rsquo;s verschillend <em>omdat hun rol verschilt</em>. Wat voor de brandweer een instortingsrisico is, is voor de ambulancedienst een toegankelijkheidsprobleem en voor de politie een afzettingsvraagstuk. Geen van die beelden is fout &mdash; ze zijn <strong>incompleet</strong>. Door de beoordelingen te delen ontstaat &eacute;&eacute;n gezamenlijk risicobeeld.</p>
        <p>De vier kernoverwegingen (allemaal waar, ook de vierde die tegenstrijdig l&iacute;jkt):</p>

    { t: 'leer', kop: 'Het model', html: `
        <p>Een gezamenlijk besluitvormingsmodel dat alle diensten delen. In het midden staat het doel: <strong>working together, saving lives, reducing harm</strong>. Daaromheen vijf stappen, met de klok mee, cyclisch:</p>

            <li><strong>Take action and review what happened</strong> &mdash; uitvoeren, evalueren, terug naar stap 1.</li>

const app = document.getElementById('app');
let sessie = null; // { moduleId, titel, wachtrij, idx, goedEersteKeer, totaalVragen, fouten: [vraagtekst] }

function isVraag(item) { return item.t !== 'leer'; }

/* ---------------- overzicht ---------------- */

function toonOverzicht() {
    sessie = null;
    const v = laadVoortgang();
    const klaar = MODULES.filter(m => v[m.id] && v[m.id].af).length;
    const pct = Math.round(100 * klaar / MODULES.length);

    let html = `
    <div class="intro-note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <div>Korte uitleg, direct oefenen, en wat je fout doet komt dezelfde sessie terug. Sluit af met de gemengde eindtoets: pas als je vragen door elkaar aankunt, zit de stof er echt in.</div>
    </div>
    <div class="card" style="padding:14px 18px;">
        <div style="display:flex; justify-content:space-between; font-size:0.82rem;">
            <span style="font-weight:600;">Voortgang</span>
            <span class="mono" style="color:var(--tekst-2);">${klaar}/${MODULES.length} modules</span>
        </div>
        <div class="voortgang-balkje"><div style="width:${pct}%"></div></div>
    </div>
    <div class="mod-lijst">`;

    MODULES.forEach((m, i) => {
        const st = v[m.id];
        const af = st && st.af;
        const score = st && st.score != null ? `${st.score}%` : '';
        html += `
        <button class="mod-item ${af ? 'af' : ''}" data-mod="${m.id}">
            <span class="mod-nr">${af ? '&#10003;' : i + 1}</span>
            <span><span class="mod-titel">${m.titel}</span><br><span class="mod-sub">${m.sub}</span></span>
            <span class="mod-score">${score}</span>
        </button>`;
    });

    const zt = v['zelftest'];
    const et = v['eindtoets'];
    html += `
        <button class="mod-item special ${zt && zt.af ? 'af' : ''}" data-mod="zelftest">
            <span class="mod-nr">?</span>
            <span><span class="mod-titel">Zelftest zonder opties</span><br><span class="mod-sub">Acht open vragen; kun je deze, dan zit de module goed</span></span>
            <span class="mod-score">${zt && zt.score != null ? zt.score + '%' : ''}</span>
        </button>
        <button class="mod-item special ${et && et.af ? 'af' : ''}" data-mod="eindtoets">
            <span class="mod-nr">&#9733;</span>
            <span><span class="mod-titel">Eindtoets</span><br><span class="mod-sub">Twaalf vragen uit alle modules, door elkaar</span></span>
            <span class="mod-score">${et && et.score != null ? et.score + '%' : ''}</span>
        </button>
    </div>`;

    app.innerHTML = html;
    app.querySelectorAll('.mod-item').forEach(b => {
        b.addEventListener('click', () => startModule(b.dataset.mod));
    });
}

/* ---------------- sessie ---------------- */

function startModule(id) {
    let titel, items;
    if (id === 'zelftest') {
        titel = ZELFTEST.titel;
        items = ZELFTEST.items.slice();
    } else if (id === 'eindtoets') {
        titel = 'Eindtoets';
        const pool = [];
        MODULES.forEach(m => m.items.forEach(it => { if (it.toets) pool.push({ ...it, bron: m.titel }); }));
        items = schud(pool).slice(0, 12);
    } else {
        const m = MODULES.find(x => x.id === id);
        titel = m.titel;
        items = m.items.slice();
    }
    sessie = {
        moduleId: id, titel,
        wachtrij: items.map(it => ({ ...it })),
        idx: 0,
        goed: 0,
        totaalVragen: items.filter(isVraag).length,
        fouten: []
    };
    toonItem();
}

function balkHtml() {
    const s = sessie;
    const pct = Math.round(100 * s.idx / s.wachtrij.length);
    return `
    <div class="oefen-top">
        <button class="stop" id="stop-knop">Stoppen</button>
        <div class="balk"><div style="width:${pct}%"></div></div>
        <span class="mono" style="font-size:0.76rem; color:var(--tekst-2);">${Math.min(s.idx + 1, s.wachtrij.length)}/${s.wachtrij.length}</span>
    </div>`;
}

function koppelStop() {
    document.getElementById('stop-knop').addEventListener('click', () => {
        if (confirm('Stoppen? De voortgang van deze module wordt niet opgeslagen.')) toonOverzicht();
    });
}

function labelVoor(item) {
    if (item.herhaling) return '<span class="item-label herhaal">Herhaling</span>';
    const namen = { leer: 'Leren', mc: 'Kies het juiste antwoord', meer: 'Selecteer alles wat klopt', volgorde: 'Zet in de juiste volgorde', koppel: 'Koppel de paren', sorteer: 'Sorteer', flits: 'Formuleer zelf het antwoord' };
    return `<span class="item-label">${namen[item.t] || ''}</span>`;
}

function toonItem() {
    const s = sessie;
    if (s.idx >= s.wachtrij.length) { toonKlaar(); return; }
    const item = s.wachtrij[s.idx];
    const render = { leer: renderLeer, mc: renderMc, meer: renderMeer, volgorde: renderVolgorde, koppel: renderKoppel, sorteer: renderSorteer, flits: renderFlits }[item.t];
    app.innerHTML = balkHtml() + '<div class="item-kaart" id="kaart"></div>';
    koppelStop();
    render(item, document.getElementById('kaart'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function registreer(item, wasGoed) {
    const s = sessie;
    if (isVraag(item) && !item.herhaling) {
        if (wasGoed) s.goed++;
        else {
            s.fouten.push(item.vraag);
            s.wachtrij.push({ ...item, herhaling: true });
        }
    }
}

function verderKnop(kaart) {
    const rij = document.createElement('div');
    rij.className = 'knop-rij';
    const k = document.createElement('button');
    k.className = 'knop';
    k.textContent = 'Verder';
    k.addEventListener('click', () => { sessie.idx++; toonItem(); });
    rij.appendChild(k);
    kaart.appendChild(rij);
    k.focus();
}

function feedbackBlok(kaart, ok, uitleg) {
    const f = document.createElement('div');
    f.className = 'feedback ' + (ok ? 'ok' : 'nee');
    f.innerHTML = `<div class="kop">${ok ? 'Goed!' : 'Niet helemaal.'}</div>${uitleg || ''}`;
    kaart.appendChild(f);
}

/* ---------------- renderers ---------------- */

function renderLeer(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<h3 style="font-family:'Playfair Display',serif; font-size:1.15rem; margin-bottom:10px;">${item.kop}</h3>${item.html}`;
    verderKnop(kaart);
}

function renderMc(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>`;
    const houder = document.createElement('div');
    houder.className = 'opties';
    kaart.appendChild(houder);
    const opties = schud(item.opties);
    opties.forEach(o => {
        const b = document.createElement('button');
        b.className = 'optie';
        b.innerHTML = o.tekst;
        b.addEventListener('click', () => {
            houder.querySelectorAll('.optie').forEach(x => x.disabled = true);
            const ok = !!o.goed;
            houder.querySelectorAll('.optie').forEach((x, i) => {
                if (opties[i].goed) x.classList.add(ok ? 'goed' : 'gemist');
            });
            if (!ok) b.classList.add('fout');
            else b.classList.add('goed');
            registreer(item, ok);
            feedbackBlok(kaart, ok, item.uitleg);
            verderKnop(kaart);
        });
        houder.appendChild(b);
    });
}

function renderMeer(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>`;
    const houder = document.createElement('div');
    houder.className = 'opties';
    kaart.appendChild(houder);
    const opties = schud(item.opties);
    const gekozen = new Set();
    opties.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'optie';
        b.innerHTML = o.tekst;
        b.addEventListener('click', () => {
            if (b.disabled) return;
            if (gekozen.has(i)) { gekozen.delete(i); b.classList.remove('gekozen'); }
            else { gekozen.add(i); b.classList.add('gekozen'); }
        });
        houder.appendChild(b);
    });
    const rij = document.createElement('div');
    rij.className = 'knop-rij';
    const check = document.createElement('button');
    check.className = 'knop';
    check.textContent = 'Controleer';
    check.addEventListener('click', () => {
        if (gekozen.size === 0) return;
        let ok = true;
        houder.querySelectorAll('.optie').forEach((b, i) => {
            b.disabled = true;
            b.classList.remove('gekozen');
            const moet = !!opties[i].goed, koos = gekozen.has(i);
            if (moet && koos) b.classList.add('goed');
            else if (moet && !koos) { b.classList.add('gemist'); ok = false; }
            else if (!moet && koos) { b.classList.add('fout'); ok = false; }
        });
        rij.remove();
        registreer(item, ok);
        feedbackBlok(kaart, ok, item.uitleg);
        verderKnop(kaart);
    });
    rij.appendChild(check);
    kaart.appendChild(rij);
}

        <div class="chips" id="volg-chips"></div>`;
    const lijst = kaart.querySelector('#volg-lijst');
    const chipsDiv = kaart.querySelector('#volg-chips');
    const bron = schud(item.items.map((tekst, i) => ({ tekst, i })));
    let keuze = [];
    let klaar = false;

    const rij = document.createElement('div');
    rij.className = 'knop-rij';
    const check = document.createElement('button');
    check.className = 'knop';
    check.textContent = 'Controleer';
    check.disabled = true;
    rij.appendChild(check);
    kaart.appendChild(rij);

    function teken() {
        lijst.innerHTML = '';
        keuze.forEach((k, pos) => {
            const r = document.createElement('div');
            r.className = 'volg-rij';
            r.innerHTML = `<span class="nr">${pos + 1}</span><span>${k.tekst}</span>`;
            if (!klaar) r.addEventListener('click', () => { keuze.splice(pos, 1); teken(); });
            lijst.appendChild(r);
        });
        chipsDiv.innerHTML = '';
        bron.forEach(k => {
            if (keuze.includes(k)) return;
            const c = document.createElement('button');
            c.className = 'chip';
            c.innerHTML = k.tekst;
            c.addEventListener('click', () => { keuze.push(k); teken(); });
            chipsDiv.appendChild(c);
        });
        check.disabled = keuze.length !== item.items.length;
    }
    teken();

    check.addEventListener('click', () => {
        klaar = true;
        let ok = true;
        lijst.querySelectorAll('.volg-rij').forEach((r, pos) => {
            const juist = keuze[pos].i === pos;
            r.classList.add(juist ? 'goed' : 'fout');
            if (!juist) ok = false;
        });
        chipsDiv.remove();
        rij.remove();
        registreer(item, ok);
        const extra = ok ? '' : `<br><br><strong>Juiste volgorde:</strong><ol style="margin:6px 0 0 20px;">${item.items.map(t => `<li>${t}</li>`).join('')}</ol>`;
        feedbackBlok(kaart, ok, (item.uitleg || '') + extra);
        verderKnop(kaart);
    });
}

function renderKoppel(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>
        <div class="koppel-kolommen"><div id="kop-links"></div><div id="kop-rechts"></div></div>`;
    const linksDiv = kaart.querySelector('#kop-links');
    const rechtsDiv = kaart.querySelector('#kop-rechts');
    linksDiv.parentElement.classList.add('koppel-kolommen');
    linksDiv.classList.add('koppel-links');

    const links = item.paren.map((p, i) => ({ tekst: p[0], i }));
    const rechts = schud(item.paren.map((p, i) => ({ tekst: p[1], i })));
    let actief = null;
    let foutTeller = 0;
    let vast = 0;

    function maakChip(k, kant, houder) {
        const c = document.createElement('button');
        c.className = 'chip';
        c.innerHTML = k.tekst;
        c.dataset.i = k.i;
        c.dataset.kant = kant;
        c.addEventListener('click', () => {
            if (c.classList.contains('vast')) return;
            if (!actief) { actief = c; c.classList.add('actief'); return; }
            if (actief === c) { c.classList.remove('actief'); actief = null; return; }
            if (actief.dataset.kant === kant) {
                actief.classList.remove('actief');
                actief = c; c.classList.add('actief'); return;
            }
            if (actief.dataset.i === c.dataset.i) {
                actief.classList.remove('actief');
                actief.classList.add('vast'); c.classList.add('vast');
                actief = null; vast++;
                if (vast === item.paren.length) klaarKoppel();
            } else {
                foutTeller++;
                c.classList.add('schud'); actief.classList.add('schud');
                const a = actief;
                setTimeout(() => { c.classList.remove('schud'); a.classList.remove('schud'); a.classList.remove('actief'); }, 380);
                actief = null;
            }
        });
        houder.appendChild(c);
    }
    links.forEach(k => maakChip(k, 'L', linksDiv));
    rechts.forEach(k => maakChip(k, 'R', rechtsDiv));

    function klaarKoppel() {
        const ok = foutTeller === 0;
        registreer(item, ok);
        const extra = ok ? '' : `<br>Je had ${foutTeller} misser${foutTeller === 1 ? '' : 's'}; dit item komt straks terug.`;
        feedbackBlok(kaart, ok, (item.uitleg || '') + extra);
        verderKnop(kaart);
    }
}

function renderSorteer(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>
        <div class="sorteer-item" id="sort-item"></div>
        <div class="sorteer-knoppen" id="sort-knoppen"></div>
        <div class="sorteer-telling" id="sort-telling"></div>`;
    const itemDiv = kaart.querySelector('#sort-item');
    const knoppen = kaart.querySelector('#sort-knoppen');
    const telling = kaart.querySelector('#sort-telling');
    const volgorde = schud(item.items);
    let pos = 0, foutTeller = 0, bezig = false;

    item.cats.forEach((cat, ci) => {
        const b = document.createElement('button');
        b.className = 'optie';
        b.textContent = cat;
        b.addEventListener('click', () => {
            if (bezig || pos >= volgorde.length) return;
            bezig = true;
            const juist = volgorde[pos].cat === ci;
            if (!juist) foutTeller++;
            b.classList.add(juist ? 'goed' : 'fout');
            itemDiv.style.borderColor = juist ? 'var(--groen)' : 'var(--rood)';
            setTimeout(() => {
                b.classList.remove('goed', 'fout');
                itemDiv.style.borderColor = '';
                pos++;
                bezig = false;
                if (pos >= volgorde.length) klaarSorteer();
                else teken();
            }, juist ? 350 : 900);
        });
        knoppen.appendChild(b);
    });

    function teken() {
        itemDiv.innerHTML = volgorde[pos].tekst;
        telling.textContent = `${pos + 1}/${volgorde.length}`;
    }
    teken();

    function klaarSorteer() {
        itemDiv.remove(); knoppen.remove(); telling.remove();
        const ok = foutTeller === 0;
        registreer(item, ok);
        const extra = ok ? '' : `<br>${foutTeller} van de ${volgorde.length} ging mis; dit item komt straks terug.`;
        feedbackBlok(kaart, ok, (item.uitleg || '') + extra);
        verderKnop(kaart);
    }
}

function renderFlits(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>
        <p class="zacht">Zeg het antwoord hardop of schrijf het op voordat je het omdraait. Zelf ophalen werkt beter dan herlezen.</p>`;
    const rij = document.createElement('div');
    rij.className = 'knop-rij';
    const toon = document.createElement('button');
    toon.className = 'knop';
    toon.textContent = 'Toon antwoord';
    toon.addEventListener('click', () => {
        rij.remove();
        const a = document.createElement('div');
        a.className = 'flits-antwoord';
        a.innerHTML = item.antwoord;
        kaart.appendChild(a);
        const rij2 = document.createElement('div');
        rij2.className = 'knop-rij';
        const goedK = document.createElement('button');
        goedK.className = 'knop';
        goedK.textContent = 'Wist ik';
        goedK.addEventListener('click', () => { registreer(item, true); sessie.idx++; toonItem(); });
        const foutK = document.createElement('button');
        foutK.className = 'knop rustig';
        foutK.textContent = 'Nog oefenen';
        foutK.addEventListener('click', () => { registreer(item, false); sessie.idx++; toonItem(); });
        rij2.appendChild(goedK); rij2.appendChild(foutK);
        kaart.appendChild(rij2);
    });
    rij.appendChild(toon);
    kaart.appendChild(rij);
}

/* ---------------- afronding ---------------- */

function toonKlaar() {
    const s = sessie;
    const score = s.totaalVragen ? Math.round(100 * s.goed / s.totaalVragen) : 100;
    const klasse = score >= 80 ? 'top' : score >= 60 ? 'matig' : 'laag';
    const boodschap = score >= 80
        ? 'Sterk. Deze stof zit erin.'
        : score >= 60
            ? 'Goede basis; de herhaalde items verdienen nog een rondje.'
            : 'Doe deze module binnenkort nog een keer; herhaald ophalen is precies hoe het blijft hangen.';

    const v = laadVoortgang();
    const vorige = v[s.moduleId] || {};
    v[s.moduleId] = { af: true, score: Math.max(score, vorige.score || 0) };
    bewaarVoortgang(v);

    let foutenHtml = '';
    if (s.fouten.length) {
        foutenHtml = `<div class="fout-lijstje"><p class="zacht" style="margin-bottom:4px;"><strong>In &eacute;&eacute;n keer goed lukte nog niet bij:</strong></p>` +
            s.fouten.map(f => `<div class="rij"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"><path d="M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span>${f}</span></div>`).join('') +
            `</div>`;
    }

    app.innerHTML = `
    <div class="card">
        <div class="klaar-kop">
            <div style="font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:600; margin-bottom:6px;">${s.titel} afgerond</div>
            <div class="cijfer ${klasse}">${score}%</div>
            <div class="toelichting">${s.goed} van ${s.totaalVragen} vragen in &eacute;&eacute;n keer goed &middot; ${boodschap}</div>
        </div>
        ${foutenHtml}
        <div class="knop-rij" style="justify-content:center;">
            <button class="knop" id="terug-knop">Naar het overzicht</button>
            <button class="knop rustig" id="opnieuw-knop">Module opnieuw</button>
        </div>
    </div>`;
    document.getElementById('terug-knop').addEventListener('click', toonOverzicht);
    document.getElementById('opnieuw-knop').addEventListener('click', () => startModule(s.moduleId));
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

toonOverzicht();
</script>
