<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #e2d9cc;
    --vlak: #ffffff;
    --vlak-zacht: #f7f3ed;
    --tekst: #2c3e36;
    --tekst-2: #6b7b6f;
    --muted: #9aa69e;
    --rand: #d5cdc2;
    --rand-licht: #e3dbd0;
    --accent: #4d7c0f;
    --accent-donker: #3f6212;
    --accent-bg: rgba(77, 124, 15, 0.08);
    --groen: #059669;
    --groen-bg: rgba(5, 150, 105, 0.1);
    --oranje: #d97706;
    --rood: #dc2626;
    --rood-bg: rgba(220, 38, 38, 0.08);
}

body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--tekst);
    line-height: 1.55;
    min-height: 100vh;
}

.wrap { max-width: 840px; margin: 0 auto; padding: 16px 16px 60px; }

.back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--tekst-2); text-decoration: none;
    font-size: 0.88rem; padding: 10px 0;
}
.back-link:hover { color: var(--accent); }
.back-link svg { width: 17px; height: 17px; }

.app-head { margin: 8px 0 18px; }
.app-head h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem; font-weight: 600;
}
.app-head .sub { color: var(--tekst-2); font-size: 0.88rem; }

.card {
    background: var(--vlak);
    border: 1px solid var(--rand-licht);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
}
.card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem; font-weight: 600; margin-bottom: 10px;
}
.card p { font-size: 0.92rem; margin-bottom: 8px; }
.card p:last-child { margin-bottom: 0; }
.card ul, .card ol { margin: 6px 0 10px 20px; font-size: 0.92rem; }
.card li { margin-bottom: 4px; }
.zacht { color: var(--tekst-2); font-size: 0.85rem; }

.quote {
    background: var(--vlak-zacht);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    margin: 10px 0;
    font-size: 0.92rem;
    font-style: italic;
}
.mono { font-family: 'JetBrains Mono', monospace; font-size: 0.86em; }

table.mini { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.87rem; }
table.mini td, table.mini th { padding: 6px 8px; border-bottom: 1px solid var(--rand-licht); text-align: left; vertical-align: top; }
table.mini th { color: var(--tekst-2); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.4px; }
table.mini td:first-child { font-weight: 700; white-space: nowrap; }

/* ------- moduleoverzicht ------- */
.intro-note {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--accent-bg);
    border: 1px solid rgba(77, 124, 15, 0.2);
    border-radius: 12px; padding: 12px 14px;
    font-size: 0.86rem; margin-bottom: 16px;
}
.intro-note svg { flex-shrink: 0; margin-top: 2px; }

.mod-lijst { display: flex; flex-direction: column; gap: 10px; }
.mod-item {
    display: grid; grid-template-columns: 34px 1fr auto;
    gap: 12px; align-items: center;
    background: var(--vlak);
    border: 1px solid var(--rand-licht);
    border-radius: 12px; padding: 13px 16px;
    cursor: pointer; text-align: left;
    font: inherit; color: inherit; width: 100%;
    transition: all 0.2s;
}
.mod-item:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(44, 62, 54, 0.08); border-color: #c4b8aa; }
.mod-nr {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--vlak-zacht); border: 1px solid var(--rand);
    font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; font-weight: 700;
    color: var(--tekst-2);
}
.mod-item.af .mod-nr { background: var(--groen-bg); border-color: rgba(5, 150, 105, 0.35); color: var(--groen); }
.mod-titel { font-weight: 600; font-size: 0.93rem; }
.mod-sub { font-size: 0.78rem; color: var(--tekst-2); }
.mod-score {
    font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
    color: var(--muted); white-space: nowrap;
}
.mod-item.af .mod-score { color: var(--groen); font-weight: 700; }

.mod-item.special { border-style: dashed; }
.mod-item.special .mod-nr { background: var(--accent-bg); border-color: rgba(77, 124, 15, 0.3); color: var(--accent); }

.voortgang-balkje {
    height: 6px; border-radius: 4px; background: var(--rand-licht);
    overflow: hidden; margin: 6px 0 2px;
}
.voortgang-balkje > div { height: 100%; background: var(--groen); border-radius: 4px; transition: width 0.5s; }

/* ------- oefenscherm ------- */
.oefen-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.oefen-top .stop {
    font: inherit; font-size: 0.8rem; color: var(--tekst-2);
    background: none; border: 1px solid var(--rand); border-radius: 50px;
    padding: 5px 13px; cursor: pointer;
}
.oefen-top .stop:hover { border-color: var(--rood); color: var(--rood); }
.balk { flex: 1; height: 8px; border-radius: 4px; background: rgba(44, 62, 54, 0.1); overflow: hidden; }
.balk > div { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s ease; }

.item-kaart {
    background: var(--vlak);
    border: 1px solid var(--rand-licht);
    border-radius: 14px;
    padding: 20px;
    animation: verschijn 0.35s ease;
}
@keyframes verschijn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.item-label {
    display: inline-block; font-size: 0.68rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--accent); background: var(--accent-bg);
    padding: 3px 10px; border-radius: 50px; margin-bottom: 12px;
}
.item-label.herhaal { color: var(--oranje); background: rgba(217, 119, 6, 0.1); }
.vraag-tekst { font-size: 1.02rem; font-weight: 600; margin-bottom: 14px; }

.opties { display: flex; flex-direction: column; gap: 8px; }
.optie {
    font: inherit; font-size: 0.9rem; text-align: left;
    background: var(--vlak-zacht); color: var(--tekst);
    border: 1px solid var(--rand); border-radius: 10px;
    padding: 11px 14px; cursor: pointer; transition: all 0.15s;
}
.optie:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-bg); }
.optie:disabled { cursor: default; }
.optie.goed { background: var(--groen-bg); border-color: var(--groen); color: var(--groen); font-weight: 600; }
.optie.fout { background: var(--rood-bg); border-color: var(--rood); color: var(--rood); }
.optie.gemist { border-color: var(--groen); border-style: dashed; color: var(--groen); }
.optie.gekozen { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip {
    font: inherit; font-size: 0.86rem; font-weight: 500;
    background: var(--vlak-zacht); border: 1px solid var(--rand);
    border-radius: 50px; padding: 8px 15px; cursor: pointer; transition: all 0.15s;
}
.chip:hover:not(:disabled) { border-color: var(--accent); }
.chip:disabled { opacity: 0.35; cursor: default; }
.volg-lijst { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; min-height: 20px; }
.volg-rij {
    display: flex; align-items: center; gap: 10px;
    background: var(--vlak-zacht); border: 1px solid var(--rand);
    border-radius: 10px; padding: 8px 12px; font-size: 0.9rem; cursor: pointer;
}
.volg-rij .nr { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; font-weight: 700; color: var(--tekst-2); width: 18px; }
.volg-rij.goed { border-color: var(--groen); background: var(--groen-bg); cursor: default; }
.volg-rij.fout { border-color: var(--rood); background: var(--rood-bg); cursor: default; }

.koppel-kolommen { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.koppel-links .chip { font-family: 'JetBrains Mono', monospace; font-weight: 700; width: 100%; }
.koppel-kolommen > div { display: flex; flex-direction: column; gap: 8px; }
.koppel-kolommen .chip { text-align: left; border-radius: 10px; }
.chip.actief { border-color: var(--accent); background: var(--accent-bg); }
.chip.vast { border-color: var(--groen); background: var(--groen-bg); color: var(--groen); cursor: default; }
.chip.schud { animation: schud 0.35s; border-color: var(--rood); }
@keyframes schud { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.sorteer-item {
    background: var(--vlak-zacht); border: 1px solid var(--rand);
    border-radius: 10px; padding: 14px; font-size: 0.95rem; font-weight: 600;
    text-align: center; margin-bottom: 12px;
}
.sorteer-knoppen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sorteer-knoppen .optie { text-align: center; font-weight: 600; }
.sorteer-telling { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 10px; font-family: 'JetBrains Mono', monospace; }

.feedback {
    margin-top: 14px; border-radius: 10px; padding: 12px 14px;
    font-size: 0.88rem; animation: verschijn 0.3s ease;
}
.feedback.ok { background: var(--groen-bg); border: 1px solid rgba(5, 150, 105, 0.3); }
.feedback.nee { background: var(--rood-bg); border: 1px solid rgba(220, 38, 38, 0.25); }
.feedback .kop { font-weight: 700; margin-bottom: 4px; }
.feedback.ok .kop { color: var(--groen); }
.feedback.nee .kop { color: var(--rood); }

.knop {
    font: inherit; font-size: 0.92rem; font-weight: 600;
    background: var(--accent); color: #fff;
    border: none; border-radius: 10px;
    padding: 11px 22px; cursor: pointer; transition: all 0.2s;
}
.knop:hover { background: var(--accent-donker); }
.knop:disabled { opacity: 0.4; cursor: default; }
.knop.rustig { background: transparent; color: var(--tekst-2); border: 1px solid var(--rand); }
.knop.rustig:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
.knop-rij { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

.flits-antwoord {
    background: var(--vlak-zacht); border: 1px solid var(--rand);
    border-radius: 10px; padding: 14px; font-size: 0.9rem; margin-top: 12px;
    animation: verschijn 0.3s ease;
}

/* ------- klaar-scherm ------- */
.klaar-kop { text-align: center; padding: 10px 0 4px; }
.klaar-kop .cijfer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.6rem; font-weight: 700; line-height: 1.2;
}
.klaar-kop .cijfer.top { color: var(--groen); }
.klaar-kop .cijfer.matig { color: var(--oranje); }
.klaar-kop .cijfer.laag { color: var(--rood); }
.klaar-kop .toelichting { color: var(--tekst-2); font-size: 0.9rem; margin-top: 4px; }
.fout-lijstje { margin-top: 14px; }
.fout-lijstje .rij {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 0; border-top: 1px solid var(--rand-licht); font-size: 0.86rem;
}
.fout-lijstje .rij svg { flex-shrink: 0; margin-top: 3px; }

.voet {
    text-align: center; margin-top: 30px;
    font-size: 0.78rem; color: var(--muted);
}
.voet a { color: var(--tekst-2); }

@media (max-width: 520px) {
    .sorteer-knoppen { grid-template-columns: 1fr; }
    .koppel-kolommen { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
'use strict';

/* ============================================================
   Didactische opzet:
   - korte leerblokken, direct gevolgd door ophaal-oefeningen
     (retrieval practice / testing effect)
   - directe, uitleggende feedback bij elk antwoord
   - fout beantwoorde items komen dezelfde sessie terug
   - eindtoets mengt vragen uit alle modules (interleaving)
   - zelftest met open vragen en zelfbeoordeling
   ============================================================ */

const OPSLAG = 'socgen-voortgang';

function laadVoortgang() {
    try { return JSON.parse(localStorage.getItem(OPSLAG)) || {}; } catch (e) { return {}; }
}
function bewaarVoortgang(v) {
    try { localStorage.setItem(OPSLAG, JSON.stringify(v)); } catch (e) {}
}
function schud(a) {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
}

/* ---------------- inhoud ---------------- */

const MODULES = [
{
    id: 'vak', titel: 'Wat is sociale geneeskunde?', sub: 'Het vak en de drie specialismen',
    items: [
    { t: 'leer', kop: 'Een ander soort relatie', html: `
        <p>Sociale geneeskunde gaat over de wisselwerking tussen gezondheid en maatschappelijke context: werk, omgeving, populatie. Het kernonderscheid met de curatieve zorg zit niet in de kennis maar in de <strong>relatie</strong>: de curatieve arts heeft een <em>behandelrelatie</em>, de sociaal geneeskundige meestal een <strong>beoordelings- of adviesrelatie</strong> &mdash; met vaak een derde belanghebbende in beeld (werkgever, UWV, overheid).</p>
        <p>Er zijn drie erkende sociaal-geneeskundige specialismen (art. 14 Wet BIG), verdeeld over twee takken:</p>
        <ul>
            <li><strong>Arbeid en gezondheid</strong>: de <strong>bedrijfsarts</strong> en de <strong>verzekeringsarts</strong>;</li>
            <li><strong>Maatschappij en gezondheid (M+G)</strong>: de <strong>arts M+G</strong>, met profielen zoals jeugdarts, arts infectieziektebestrijding, arts tbc-bestrijding, arts medische milieukunde, donorarts en (per 2026) het profiel medisch advies. Forensische geneeskunde is sinds 2022 een zelfstandig profiel.</li>
        </ul>
        <p class="zacht">Ter perspectief: ongeveer 70% van de artsen werkt buiten het ziekenhuis. De vervolgopleidingen lopen via de NSPOH (Utrecht) en de SGBO (Nijmegen): vier jaar, ongeveer 80% praktijk en 20% cursorisch onderwijs, competentiegericht (CanMEDS).</p>` },
    { t: 'leer', kop: 'Wie doet wat', html: `
        <table class="mini">
            <tr><th>Arts</th><th>Voor wie</th><th>Kernrol</th></tr>
            <tr><td>Bedrijfsarts</td><td>Werkgever &eacute;n werknemer</td><td><strong>Adviseren</strong>: verzuimbegeleiding en preventie. Behandelt in beginsel niet, beslist niet.</td></tr>
            <tr><td>Verzekeringsarts</td><td>Vooral UWV</td><td><strong>Beoordelen</strong>: claimbeoordeling Ziektewet, WIA, Wajong.</td></tr>
            <tr><td>Arts M+G</td><td>Publieke gezondheid (GGD, JGZ, RIVM)</td><td><strong>Populatiegericht</strong>: preventie, bescherming, beleid.</td></tr>
        </table>
        <p>Bij de WIA-beoordeling legt de <strong>verzekeringsarts</strong> de beperkingen vast in de Functionele Mogelijkhedenlijst (FML); de <strong>arbeidsdeskundige</strong> vertaalt die naar functies en berekent het arbeidsongeschiktheidspercentage. De verzekeringsarts stelt dus niet zelf het percentage vast.</p>
        <p class="zacht">De bedrijfsarts wordt betaald door de werkgever maar is <strong>professioneel onafhankelijk</strong> (artseneed, professioneel statuut, tuchtrecht). &ldquo;De bedrijfsarts is van de baas&rdquo; is een klassieke misvatting.</p>` },
    { t: 'mc', toets: true, vraag: 'Wat onderscheidt de sociaal geneeskundige het meest fundamenteel van de curatieve arts?',
        opties: [
            { tekst: 'De relatie: meestal een beoordelings- of adviesrelatie, vaak met een derde belanghebbende, in plaats van een behandelrelatie', goed: true },
            { tekst: 'Het kennisdomein: sociale geneeskunde gaat niet over ziekte maar over gedrag' },
            { tekst: 'De setting: sociaal geneeskundigen werken nooit met individuele pati&euml;nten' },
            { tekst: 'De opleiding: sociale geneeskunde is geen erkend specialisme' }
        ],
        uitleg: 'Bedrijfsarts, verzekeringsarts en arts M+G zijn volwaardige art. 14-specialismen. Het verschil zit in de relatievorm: adviseren of beoordelen, met werkgever, UWV of samenleving als derde partij.' },
    { t: 'mc', toets: true, vraag: 'Welke drie sociaal-geneeskundige specialismen kent de Wet BIG?',
        opties: [
            { tekst: 'Bedrijfsarts, verzekeringsarts en arts maatschappij + gezondheid', goed: true },
            { tekst: 'Bedrijfsarts, jeugdarts en forensisch arts' },
            { tekst: 'Arbo-arts, keuringsarts en GGD-arts' },
            { tekst: 'Bedrijfsarts, verzekeringsarts en vertrouwensarts' }
        ],
        uitleg: 'Jeugdarts, forensisch arts en vertrouwensarts zijn KNMG-profielen, geen wettelijke specialistentitels. Dat onderscheid wordt vaak getoetst.' },
    { t: 'koppel', toets: true, vraag: 'Koppel de arts aan de kernrol.',
        paren: [
            ['Bedrijfsarts', 'Adviseert werkgever en werknemer over verzuim en preventie'],
            ['Verzekeringsarts', 'Beoordeelt claims op Ziektewet en WIA bij het UWV'],
            ['Arts M+G', 'Werkt populatiegericht aan de publieke gezondheid']
        ],
        uitleg: 'Adviseren, beoordelen, populatie: drie woorden die de drie specialismen samenvatten.' },
    { t: 'mc', toets: true, vraag: 'Wie berekent het arbeidsongeschiktheidspercentage bij een WIA-beoordeling?',
        opties: [
            { tekst: 'De arbeidsdeskundige, op basis van de Functionele Mogelijkhedenlijst van de verzekeringsarts', goed: true },
            { tekst: 'De verzekeringsarts, op basis van de ernst van de diagnose' },
            { tekst: 'De bedrijfsarts, in het re-integratieverslag' },
            { tekst: 'De werkgever, samen met de casemanager' }
        ],
        uitleg: 'De verzekeringsarts stelt de beperkingen vast (FML); de arbeidsdeskundige duidt met het CBBS passende functies en berekent het verlies aan verdiencapaciteit. Het medisch oordeel alleen bepaalt het percentage niet.' },
    { t: 'mc', vraag: '&ldquo;De bedrijfsarts is van de baas, dus die kant kiest hij ook.&rdquo; Klopt dat?',
        opties: [
            { tekst: 'Nee: de werkgever betaalt, maar de bedrijfsarts is professioneel onafhankelijk, gebonden aan beroepsgeheim en toetsbaar via het tuchtrecht', goed: true },
            { tekst: 'Ja, daarom bestaat het recht op second opinion' },
            { tekst: 'Ja, tenzij de werknemer om een onafhankelijke arts vraagt' },
            { tekst: 'Nee, want de bedrijfsarts is in dienst van het UWV' }
        ],
        uitleg: 'Onafhankelijkheid is geborgd via artseneed, professioneel statuut en tuchtrecht. De second opinion bestaat voor twijfel over het advies, niet omdat de bedrijfsarts partijdig zou zijn.' }
    ]
},
{
    id: 'modellen', titel: 'Gezondheid en werk: de modellen', sub: 'Positieve gezondheid, ICF en werk als medicijn',
    items: [
    { t: 'leer', kop: 'Wat is gezondheid?', html: `
        <p>De WHO-definitie (1948) noemt gezondheid &ldquo;een toestand van volledig fysiek, mentaal en sociaal welbevinden&rdquo;. Machteld Huber zette daar in 2011 <strong>positieve gezondheid</strong> tegenover:</p>
        <div class="quote">Gezondheid als het vermogen om je aan te passen en je eigen regie te voeren, in het licht van de sociale, fysieke en emotionele uitdagingen van het leven.</div>
        <p>Zes dimensies in het spinnenweb: <strong>lichaamsfuncties, mentaal welbevinden, zingeving, kwaliteit van leven, meedoen, dagelijks functioneren</strong>. Let op: dit is een invloedrijk Nederlands concept, g&eacute;&eacute;n offici&euml;le vervanging van de WHO-definitie.</p>
        <p class="zacht">Daarnaast: het <strong>biopsychosociale model</strong> (Engel, 1977) &mdash; ziekte als samenspel van biologische, psychologische en sociale factoren &mdash; en het <strong>belasting-belastbaarheidsmodel</strong>: verzuim ontstaat bij disbalans tussen (werk)belasting en individuele belastbaarheid; interventie kan aan beide kanten.</p>` },
    { t: 'leer', kop: 'ICF en werk als medicijn', html: `
        <p>Het <strong>ICF-model</strong> (WHO) beschrijft menselijk functioneren op drie niveaus, be&iuml;nvloed door externe en persoonlijke factoren. Het is de basis van de verzekeringsgeneeskundige beoordeling:</p>

            <tr><td>Participatie</td><td>Problemen met deelname aan het maatschappelijk leven (bv. het beroep niet kunnen uitoefenen)</td></tr>
        </table>

        uitleg: 'De &ldquo;toestand van volledig welbevinden&rdquo; is de WHO-definitie uit 1948. Huber verlegt het accent van toestand naar vermogen: aanpassen en eigen regie.' },
    { t: 'koppel', toets: true, vraag: 'Een magazijnmedewerker heeft knieartrose. Koppel elk gegeven aan het juiste ICF-niveau.',

{
    id: 'arbo', titel: 'Arbowet en de bedrijfsarts', sub: 'Basiscontract, spreekuur en second opinion',
    items: [
    { t: 'leer', kop: 'Wat de Arbowet regelt', html: `
        <p>Sinds de herziening van 1 juli 2017:</p>
        <ul>
            <li><strong>RI&amp;E</strong>: elke werkgever heeft een risico-inventarisatie en -evaluatie met plan van aanpak;</li>
            <li><strong>Preventiemedewerker</strong>: minimaal &eacute;&eacute;n per bedrijf (tot 25 werknemers mag de werkgever het zelf zijn);</li>
            <li><strong>Basiscontract</strong> met de arbodienst/bedrijfsarts, met verplichte onderdelen: verzuimbegeleiding, toetsing RI&amp;E, <strong>open spreekuur</strong> (de werknemer mag zonder toestemming &eacute;n zonder medeweten van de werkgever de bedrijfsarts bezoeken, ook zonder verzuim), <strong>vrije toegang van de bedrijfsarts tot de werkvloer</strong>, second opinion, klachtenprocedure en de melding van beroepsziekten aan het NCvB;</li>
            <li><strong>PAGO/PMO</strong>: de werkgever moet periodiek arbeidsgezondheidskundig onderzoek a&aacute;nbieden, gericht op de risico&rsquo;s uit de RI&amp;E; deelname is voor de werknemer vrijwillig.</li>
        </ul>
        <p class="zacht">Twee instrumenten die vaak worden verward: de <strong>second opinion</strong> (andere bedrijfsarts, op verzoek van de werknemer, betaald door de werkgever, over het advies van de bedrijfsarts) en het <strong>deskundigenoordeel</strong> van het UWV (door werkgever &oacute;f werknemer aan te vragen bij vastgelopen re-integratie, ca. &euro; 100 werknemer / &euro; 400 werkgever). Beide zijn niet bindend.</p>` },
    { t: 'meer', toets: true, vraag: 'Wat moet er minimaal in het basiscontract met de arbodienst staan? Selecteer alles wat klopt.',
        opties: [
            { tekst: 'Een open spreekuur bij de bedrijfsarts', goed: true },
            { tekst: 'Vrije toegang van de bedrijfsarts tot de werkvloer', goed: true },
            { tekst: 'De mogelijkheid van een second opinion', goed: true },
            { tekst: 'Een klachtenprocedure', goed: true },
            { tekst: 'Behandeling van zieke werknemers door de bedrijfsarts' },
            { tekst: 'Een jaarlijkse verplichte keuring van alle werknemers' }
        ],
        uitleg: 'De bedrijfsarts behandelt in beginsel niet, en een algemene periodieke keuring is juist niet toegestaan; het PAGO is een aanbod waarvan de deelname vrijwillig is.' },
    { t: 'mc', toets: true, vraag: 'Wat is het verschil tussen een second opinion en een deskundigenoordeel?',
        opties: [
            { tekst: 'Second opinion: andere bedrijfsarts, op verzoek van de werknemer, over het advies van de bedrijfsarts. Deskundigenoordeel: het UWV, door beide partijen aan te vragen, over re-integratievragen', goed: true },
            { tekst: 'Het zijn twee namen voor dezelfde UWV-procedure' },

{
    id: 'privacy', titel: 'Privacy, rechten en plichten', sub: 'Wat wel en niet mag rond de zieke werknemer',
    items: [
    { t: 'leer', kop: 'De ziekmelding en de terugkoppeling', html: `
        <p>Bij een ziekmelding mag de werkgever volgens de Autoriteit Persoonsgegevens alleen vragen en registreren:</p>
        <ul>
            <li>telefoonnummer en (verpleeg)adres;</li>
            <li>de <strong>verwachte duur</strong> van het verzuim;</li>
            <li>lopende afspraken en werkzaamheden die overgedragen moeten worden;</li>
            <li>&oacute;f een Ziektewet-vangnetbepaling geldt (niet welke) en of er samenhang is met een arbeidsongeval.</li>
        </ul>
        <p><strong>Niet toegestaan</strong>: vragen naar aard en oorzaak van de klachten of de diagnose. Zelfs spontaan gedeelde medische informatie mag de werkgever in de regel niet registreren.</p>
        <p>De bedrijfsarts koppelt aan de werkgever alleen terug wat nodig is voor loondoorbetaling en re-integratie: <strong>functionele beperkingen en mogelijkheden, passend werk en prognose</strong>. G&eacute;&eacute;n diagnose: de bedrijfsarts heeft een beroepsgeheim jegens de werkgever.</p>` },
    { t: 'leer', kop: 'Keuringen, sancties en het arbeidsconflict', html: `
        <p><strong>Aanstellingskeuringen</strong> (Wet op de medische keuringen): standaard keuren bij sollicitatie is verboden, net als gezondheidsvragen in het sollicitatiegesprek. Een keuring mag alleen bij <strong>bijzondere functie-eisen</strong> (veiligheid), schriftelijk vastgelegd en door een bedrijfsarts. Klassieke toegestane voorbeelden: militairen, piloten, duikers, brandweer.</p>
        <p><strong>Loonopschorting vs. loonstop</strong> &mdash; h&eacute;t klassieke misverstand:</p>
        <table class="mini">
            <tr><td>Loonopschorting</td><td>Bij schending van <em>controlevoorschriften</em> (onbereikbaar, niet op spreekuur). Drukmiddel: bij alsnog meewerken wordt het loon <strong>met terugwerkende kracht</strong> betaald.</td></tr>
            <tr><td>Loonstop</td><td>Bij schending van <em>re-integratieverplichtingen</em> (passende arbeid weigeren, herstel belemmeren). Het loon over die periode is <strong>definitief kwijt</strong>.</td></tr>
        </table>
        <p><strong>Arbeidsconflict</strong> (STECR-werkwijzer): een conflict z&oacute;nder medische beperkingen is geen arbeidsongeschiktheid wegens ziekte. Advies: korte interventieperiode (doorgaans max. 2 weken) met de verplichting het conflict actief op te lossen, zo nodig via mediation.</p>` },
    { t: 'meer', toets: true, vraag: 'Wat mag de werkgever bij een ziekmelding vragen en registreren? Selecteer alles wat klopt.',
        opties: [
            { tekst: 'De verwachte duur van het verzuim', goed: true },
            { tekst: 'Telefoonnummer en verpleegadres', goed: true },
            { tekst: 'Welke werkzaamheden en afspraken overgenomen moeten worden', goed: true },
            { tekst: '&Oacute;f een Ziektewet-vangnetbepaling van toepassing is', goed: true },
            { tekst: 'De aard en oorzaak van de klachten' },
            { tekst: 'Welke diagnose de huisarts heeft gesteld' }
        ],
        uitleg: 'Aard, oorzaak en diagnose zijn medische gegevens; die horen bij de bedrijfsarts. Zelfs als de werknemer ze spontaan deelt, mag de werkgever ze in de regel niet vastleggen.' },
    { t: 'mc', toets: true, vraag: 'Een werknemer verschijnt zonder bericht niet op het spreekuur van de bedrijfsarts, waardoor de ziekte niet te beoordelen is. Welke sanctie past hierbij?',
        opties: [
            { tekst: 'Loonopschorting: na een schriftelijke waarschuwing; werkt de werknemer alsnog mee, dan krijgt hij het loon met terugwerkende kracht', goed: true },
            { tekst: 'Loonstop: het loon over deze periode is definitief verloren' },
            { tekst: 'Ontslag op staande voet wegens werkweigering' },
            { tekst: 'Een boete ter hoogte van een dagloon' }
        ],
        uitleg: 'Niet verschijnen is schending van controlevoorschriften (lid 6): opschorting. Passende arbeid weigeren is schending van re-integratieplichten (lid 3): loonstop, definitief. Wie de verkeerde sanctie noemt, moet als werkgever alles nabetalen.' },
    { t: 'mc', toets: true, vraag: 'Wat mag de bedrijfsarts aan de werkgever terugkoppelen over een zieke werknemer?',
        opties: [
            { tekst: 'Functionele beperkingen en mogelijkheden, passend werk en de prognose; geen diagnose', goed: true },
            { tekst: 'De diagnose, mits de werknemer toestemming geeft via een standaardformulier' },
            { tekst: 'Alles wat de werkgever nodig zegt te hebben voor de bedrijfsvoering' },
            { tekst: 'Niets; elke terugkoppeling schendt het beroepsgeheim' }
        ],
        uitleg: 'De terugkoppeling is functioneel, niet medisch: wat kan iemand wel en niet, en hoe lang naar verwachting. Daarmee kan de werkgever re-integreren zonder de diagnose te kennen.' },
    { t: 'mc', toets: true, vraag: 'Mag een werkgever sollicitanten standaard medisch keuren?',
        opties: [
            { tekst: 'Nee: alleen bij bijzondere functie-eisen mag een aanstellingskeuring, zoals bij militairen, piloten en duikers', goed: true },
            { tekst: 'Ja, mits de sollicitant vooraf instemt' },
            { tekst: 'Ja, maar alleen na het arbeidsvoorwaardengesprek' },
            { tekst: 'Nee, aanstellingskeuringen zijn in Nederland volledig verboden' }
        ],
        uitleg: 'De Wet op de medische keuringen verbiedt standaard keuren en gezondheidsvragen bij sollicitaties. Voor de aanstelling als militair geldt in de wet een expliciete uitzonderingspositie.' },
    { t: 'mc', vraag: 'Een werknemer meldt zich ziek na een hoogoplopend conflict met de leidinggevende. De bedrijfsarts vindt geen medische beperkingen. Wat is het advies volgens de STECR-werkwijzer?',
        opties: [
            { tekst: 'Geen arbeidsongeschiktheid wegens ziekte; een korte interventieperiode waarin het conflict actief wordt opgelost, zo nodig met mediation', goed: true },
            { tekst: 'Ziekmelding accepteren tot het conflict is opgelost' },
            { tekst: 'Direct een loonstop adviseren aan de werkgever' },
            { tekst: 'Doorverwijzen naar de verzekeringsarts voor een WIA-beoordeling' }
        ],
        uitleg: 'Een conflict is geen ziekte. De term &ldquo;situatieve arbeidsongeschiktheid&rdquo; wordt tegenwoordig zelfs ontraden omdat hij verwarring schept. De oplossing is gespreksvoering, niet verzuim.' }
    ]
},
{
    id: 'dubbelrol', titel: 'De militair arts: dubbele rol', sub: 'Zorgteam, beroepsgeheim en de commandant',
    items: [
    { t: 'leer', kop: 'E&eacute;n loket, wettelijk geregeld', html: `
        <p>De militair in werkelijke dienst is wettelijk verplicht zich voor zorg te wenden tot het aangewezen <strong>zorgteam</strong> van de militair geneeskundige dienst (art. 12h, voorheen Militaire Ambtenarenwet). Bezoekt hij toch een civiele arts, dan moet dat aan het zorgteam worden <strong>gemeld</strong>: het zorgteam moet continu zicht houden op de operationele inzetbaarheid.</p>
        <p>Een zorgteam bestaat uit &eacute;&eacute;n of meer <strong>algemeen militair artsen</strong>, ten minste &eacute;&eacute;n geregistreerde <strong>militaire huisarts</strong> en &eacute;&eacute;n geregistreerde <strong>militaire bedrijfsarts</strong>. De AMA verenigt dus wat civiel strikt gescheiden is: huisartsgeneeskundige &eacute;n bedrijfsgeneeskundige zorg, met &eacute;&eacute;n ge&iuml;ntegreerd medisch dossier waartoe alleen artsen toegang hebben.</p>
        <p class="zacht">Waarom een eigen militaire gezondheidszorg? De zorg moet meegaan op oefening en uitzending, en de inzetbaarheid van eenheden moet continu geborgd zijn. Militairen hebben daarom geen civiele huisarts.</p>` },
    { t: 'leer', kop: 'Adviseren zonder diagnose', html: `
        <p>De <strong>verantwoordelijk militair arts (VMA)</strong> adviseert de commandant &mdash; gevraagd &eacute;n ongevraagd &mdash; over de <strong>operationele inzetbaarheid</strong> van de militair. Dat gebeurt na overleg met de militair, maar <strong>ongeacht diens toestemming</strong>, en altijd <strong>zonder de aard van de onderliggende aandoening te noemen</strong>. Dit is het need-to-know-principe: de commandant hoort w&aacute;t iemand wel en niet kan, nooit waar&oacute;m.</p>
        <p>Daar staan plichten van de militair tegenover: meewerken aan geneeskundig onderzoek naar de inzetbaarheid, aanwijzingen van de VMA bij ziekte opvolgen, en voorgeschreven gezondheidsbeschermende maatregelen dulden, waaronder bepaalde vaccinaties.</p>
        <p class="zacht">Het spanningsveld heet dual loyalty: de arts dient de individuele pati&euml;nt &eacute;n de eenheid en missie. De wettelijke constructie lost dit op door de informatiestroom te beperken tot inzetbaarheid, niet door het beroepsgeheim op te heffen.</p>` },
    { t: 'mc', toets: true, vraag: 'Wat mag de verantwoordelijk militair arts aan de commandant melden over een militair?',
        opties: [
            { tekst: 'De operationele inzetbaarheid en beperkingen, zonder de aard van de aandoening te noemen; toestemming van de militair is daarvoor niet vereist, wel overleg', goed: true },
            { tekst: 'De volledige diagnose, want de commandant is eindverantwoordelijk' },
            { tekst: 'Niets, tenzij de militair schriftelijk toestemming geeft' },
            { tekst: 'Alleen dat de militair ziek is, verder niets' }
        ],
        uitleg: 'Dit is wettelijk geregeld: het advies over inzetbaarheid gaat door, ook zonder toestemming, maar de diagnose blijft binnen het zorgteam. Beperkingen delen mag; verklaren waarom niet.' },
    { t: 'mc', toets: true, vraag: 'Een militair bezoekt in het weekend de civiele huisartsenpost. Wat geldt er?',
        opties: [
            { tekst: 'Dat mag bij noodzaak, maar het moet aan het eigen zorgteam worden gemeld: dat moet continu zicht houden op de inzetbaarheid', goed: true },
            { tekst: 'Dat is verboden; militairen mogen nooit civiele zorg gebruiken' },
            { tekst: 'Dat is priv&eacute;; Defensie heeft er niets mee te maken' },
            { tekst: 'Alleen toegestaan met vooraf verkregen toestemming van de commandant' }
        ],
        uitleg: 'De meldplicht dient het complete medische beeld: een zorgteam dat de helft van de zorg niet kent, kan de inzetbaarheid niet betrouwbaar beoordelen.' },
    { t: 'mc', toets: true, vraag: 'Waaruit bestaat een geneeskundig zorgteam minimaal?',
        opties: [
            { tekst: 'E&eacute;n of meer algemeen militair artsen, ten minste &eacute;&eacute;n geregistreerde militaire huisarts en &eacute;&eacute;n geregistreerde militaire bedrijfsarts', goed: true },
            { tekst: 'E&eacute;n AMA en &eacute;&eacute;n verpleegkundige per compagnie' },
            { tekst: 'E&eacute;n militaire huisarts en &eacute;&eacute;n civiele bedrijfsarts' },
            { tekst: 'De commandant, een arts en een bedrijfsmaatschappelijk werker' }
        ],
        uitleg: 'Zo zit huisartsgeneeskundige en bedrijfsgeneeskundige expertise in &eacute;&eacute;n team, met vrije informatie-uitwisseling en &eacute;&eacute;n ge&iuml;ntegreerd dossier.' },
    { t: 'mc', vraag: 'Wat is het belangrijkste verschil tussen de AMA en een civiele bedrijfsarts?',
        opties: [
            { tekst: 'De AMA levert curatieve &eacute;n bedrijfsgeneeskundige zorg ge&iuml;ntegreerd; civiel zijn behandeling en verzuimbegeleiding strikt gescheiden', goed: true },
            { tekst: 'De AMA heeft geen beroepsgeheim richting de werkgever' },
            { tekst: 'De AMA beoordeelt ook uitkeringsclaims, zoals een verzekeringsarts' },
            { tekst: 'Er is geen verschil; AMA is de militaire naam voor bedrijfsarts' }
        ],
        uitleg: 'Het ge&iuml;ntegreerde model bestaat omdat zorg en inzetbaarheidsbewaking op oefening en uitzending in &eacute;&eacute;n hand moeten liggen. Het beroepsgeheim richting de commandant blijft daarbij overeind.' }
    ]
},
{
    id: 'inzet', titel: 'Keuring, oefening en uitzending', sub: 'Van aanstellingskeuring tot hitteadvies',
    items: [
    { t: 'leer', kop: 'Geschiktheid en keuringen', html: `
        <p>De aanstellingskeuring voor militairen is wettelijk toegestaan (uitzonderingspositie in de Wet op de medische keuringen) en volgt het <strong>Militair keuringsreglement</strong>, met als uitwerking de Handleiding MKR. De systematiek: wie niet ongeschikt wordt bevonden, is geschikt. Mogelijke uitkomsten: <strong>geschikt</strong>, <strong>ongeschikt</strong>, of <strong>tijdelijk ongeschikt</strong> voor 3, 6, 9 of 12 maanden als volledig herstel binnen een jaar mogelijk wordt geacht (daarna herkeuring).</p>
        <p class="zacht">Daarnaast bestaan functiegebonden periodieke keuringen: vliegers jaarlijks (boven de 40 twee keer per jaar), duikers jaarlijks.</p>` },
    { t: 'leer', kop: 'Inzetbaarheid bij oefening en uitzending', html: `
        <p>Het <strong>inzetbaarheidsadvies</strong> van de VMA is medisch-inhoudelijk <strong>bindend</strong>; de Inspectie Militaire Gezondheidszorg constateerde dat dit juist bij opleidingen en oefeningen nog weleens niet wordt opgevolgd. Maar de <strong>inzetbeslissing</strong> zelf blijft van de commandant: v&oacute;&oacute;r een uitzending bepaalt de commandant de uitzendgeschiktheid, na raadpleging van het sociaal medisch team over de medische, psychische en sociale geschiktheid. Kort: <strong>de arts adviseert (bindend op het medische deel), de commandant besluit.</strong></p>
        <ul>
            <li><strong>Dental fitness</strong>: jaarlijkse vaststelling; NAVO-classificatie in vier klassen, waarbij klasse 3 en 4 niet wereldwijd inzetbaar zijn;</li>
            <li><strong>Vaccinatiestatus</strong>: het gezondheidscentrum bewaakt die; sommige vaccinaties zijn verplicht;</li>
            <li><strong>Hitte</strong>: bij oefeningen hoort een risicoanalyse op basis van de <strong>WBGT</strong> (wet bulb globe temperature: temperatuur, vocht, straling, wind); de arts adviseert over duur, intensiteit, kleding en drinkbeleid, de commandant blijft verantwoordelijk voor de oefening;</li>
            <li><strong>Gehoor</strong>: audiogram bij indiensttreding met periodiek herhaalonderzoek, en gehoorbescherming als standaarduitrusting.</li>
        </ul>` },
    { t: 'mc', toets: true, vraag: 'Wie besluit of een militair meegaat op oefening, en wat is daarbij de status van het medisch advies?',
        opties: [
            { tekst: 'De commandant besluit over de inzet, maar het inzetbaarheidsadvies van de verantwoordelijk militair arts is medisch-inhoudelijk bindend', goed: true },
            { tekst: 'De arts besluit; de commandant voert uit' },
            { tekst: 'De commandant besluit en mag het medisch advies naast zich neerleggen' },
            { tekst: 'Het sociaal medisch team besluit bij meerderheid van stemmen' }
        ],
        uitleg: 'De rolverdeling is strikt: de arts gaat over het medische oordeel (bindend), de commandant over de operationele afweging. De inspectie wijst er al jaren op dat dit bij oefeningen soms misgaat.' },
    { t: 'mc', toets: true, vraag: 'Een keurling heeft een aandoening waarvan volledig herstel binnen een jaar wordt verwacht. Wat is de uitkomst van de keuring?',
        opties: [
            { tekst: 'Tijdelijk ongeschikt voor 3, 6, 9 of 12 maanden, met daarna een herkeuring', goed: true },
            { tekst: 'Ongeschikt; herkansen kan pas na vijf jaar' },
            { tekst: 'Geschikt onder voorbehoud van een verklaring van de huisarts' },
            { tekst: 'De keuring wordt uitgesteld tot na het herstel' }
        ],
        uitleg: 'De categorie tijdelijk ongeschikt voorkomt dat een herstelbare aandoening tot definitieve afwijzing leidt. Bij de herkeuring volgt het definitieve oordeel.' },
    { t: 'mc', toets: true, vraag: 'Een militair heeft dental-fitnessklasse 3. Wat betekent dat voor uitzending?',
        opties: [
            { tekst: 'Klasse 3 en 4 gelden als niet wereldwijd inzetbaar; het gebit moet eerst op orde', goed: true },
            { tekst: 'Niets; dental fitness is alleen een administratieve registratie' },
            { tekst: 'De militair mag mee, maar alleen naar missies met een tandarts' },
            { tekst: 'Klasse 3 is de beste klasse; de militair is direct uitzendbaar' }
        ],
        uitleg: 'De NAVO-classificatie (vier klassen) bestaat omdat een tandheelkundig spoedgeval in het inzetgebied een vermijdbare uitvaller is. Vandaar de jaarlijkse controle gedurende de hele loopbaan.' },
    { t: 'mc', toets: true, vraag: 'Wat is de WBGT en waarvoor gebruikt de militair arts hem?',
        opties: [
            { tekst: 'Een hittemaat op basis van temperatuur, vocht, straling en wind; basis voor het advies aan de commandant over duur, intensiteit, kleding en drinkbeleid van een oefening', goed: true },
            { tekst: 'Een conditietest die bepaalt wie mee mag op oefening' },
            { tekst: 'De koorts-drempel waarboven een militair naar huis moet' },
            { tekst: 'Een NAVO-classificatie voor uitzendgeschiktheid' }
        ],
        uitleg: 'Gewone luchttemperatuur onderschat het hitterisico bij inspanning met bepakking. De arts adviseert op basis van de WBGT-risicoanalyse; de commandant blijft verantwoordelijk voor de oefening.' },
    { t: 'meer', vraag: 'Waarover adviseert het sociaal medisch team bij de vraag of iemand uitzendgeschikt is? Selecteer alles wat klopt.',
        opties: [
            { tekst: 'De medische geschiktheid', goed: true },
            { tekst: 'De psychische geschiktheid', goed: true },
            { tekst: 'De sociale geschiktheid, zoals de thuissituatie', goed: true },
            { tekst: 'De rang en het functioneringsdossier' },
            { tekst: 'De financi&euml;le situatie van de militair' }
        ],
        uitleg: 'Uitzendgeschiktheid is breder dan fysiek fit zijn: een instabiele thuissituatie of psychische kwetsbaarheid kan op uitzending net zo goed tot uitval leiden.' }

},
{
    id: 'verzuimmil', titel: 'Verzuim, SMT en rechtspositie', sub: 'Van ziekmelding tot invaliditeitspensioen',
    items: [
    { t: 'leer', kop: 'Ziekmelding en het sociaal medisch team', html: `
        <p>De ziekmelding binnen Defensie is geregeld: zo spoedig mogelijk, uiterlijk <strong>anderhalf uur</strong> na de normale aanvang van het werk, en <strong>persoonlijk bij de direct leidinggevende</strong>. Ziekteverzuim betekent daarbij: medisch objectiveerbare ongeschiktheid om te werken; dat beoordeelt de arts, niet de militair zelf.</p>
        <p>Het <strong>sociaal medisch team (SMT)</strong> is het adviesorgaan van de eenheidscommandant over verzuim, re-integratie en inzetbaarheid. Vaste kern: de commandant (regie), de P&amp;O-adviseur, de verantwoordelijk militair arts, de bedrijfsmaatschappelijk werker en de geestelijk verzorger. Elk SMT-lid dat weet of vermoedt dat inzet van een militair gevaar oplevert voor de militair, de omgeving of de missie, moet dit &mdash; binnen de grenzen van het eigen beroepsgeheim &mdash; aan de commandant melden.</p>
        <p class="zacht">Bij langdurig verzuim volgt Defensie de poortwachter-systematiek; het Dienstencentrum Re-integratie begeleidt spoor 1 (binnen Defensie) en spoor 2 (daarbuiten).</p>` },
    { t: 'leer', kop: 'Rechtspositie: waar het militaire stelsel afwijkt', html: `
        <ul>
            <li><strong>Inkomsten bij ziekte</strong>: de eerste 12 maanden 100%, daarna 70% &mdash; maar het blijft 100% als de ziekte in overwegende mate het gevolg is van de dienst (<strong>dienstverbandaandoening</strong>);</li>
            <li><strong>WIA</strong>: anders dan vaak gedacht zijn beroepsmilitairen sinds 2007 gewoon WIA-verzekerd, met een gecombineerde beoordeling waarin ook het militair invaliditeitspensioen en het dienstverband worden beoordeeld;</li>

/* ---------------- app-status ---------------- */

const app = document.getElementById('app');
let sessie = null; // { moduleId, titel, wachtrij, idx, goedEersteKeer, totaalVragen, fouten: [vraagtekst] }

function isVraag(item) { return item.t !== 'leer'; }

/* ---------------- overzicht ---------------- */

function toonOverzicht() {
    sessie = null;
    const v = laadVoortgang();
    const klaar = MODULES.filter(m => v[m.id] && v[m.id].af).length;
    const pct = Math.round(100 * klaar / MODULES.length);

    let html = `
    <div class="intro-note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4d7c0f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <div>Korte uitleg, direct oefenen, en wat je fout doet komt dezelfde sessie terug. Sluit af met de gemengde eindtoets: pas als je vragen door elkaar aankunt, zit de stof er echt in. Wet- en regelgeving verandert; controleer details bij twijfel altijd bij de actuele bron.</div>
    </div>
    <div class="card" style="padding:14px 18px;">
        <div style="display:flex; justify-content:space-between; font-size:0.82rem;">
            <span style="font-weight:600;">Voortgang</span>
            <span class="mono" style="color:var(--tekst-2);">${klaar}/${MODULES.length} modules</span>
        </div>
        <div class="voortgang-balkje"><div style="width:${pct}%"></div></div>
    </div>
    <div class="mod-lijst">`;

    MODULES.forEach((m, i) => {
        const st = v[m.id];
        const af = st && st.af;
        const score = st && st.score != null ? `${st.score}%` : '';
        html += `
        <button class="mod-item ${af ? 'af' : ''}" data-mod="${m.id}">
            <span class="mod-nr">${af ? '&#10003;' : i + 1}</span>
            <span><span class="mod-titel">${m.titel}</span><br><span class="mod-sub">${m.sub}</span></span>
            <span class="mod-score">${score}</span>
        </button>`;
    });

    const zt = v['zelftest'];
    const et = v['eindtoets'];
    html += `
        <button class="mod-item special ${zt && zt.af ? 'af' : ''}" data-mod="zelftest">
            <span class="mod-nr">?</span>
            <span><span class="mod-titel">Zelftest zonder opties</span><br><span class="mod-sub">Acht open vragen; kun je deze, dan zit de module goed</span></span>
            <span class="mod-score">${zt && zt.score != null ? zt.score + '%' : ''}</span>
        </button>
        <button class="mod-item special ${et && et.af ? 'af' : ''}" data-mod="eindtoets">
            <span class="mod-nr">&#9733;</span>
            <span><span class="mod-titel">Eindtoets</span><br><span class="mod-sub">Twaalf vragen uit alle modules, door elkaar</span></span>
            <span class="mod-score">${et && et.score != null ? et.score + '%' : ''}</span>
        </button>
    </div>`;

    app.innerHTML = html;
    app.querySelectorAll('.mod-item').forEach(b => {
        b.addEventListener('click', () => startModule(b.dataset.mod));
    });
}

/* ---------------- sessie ---------------- */

function startModule(id) {
    let titel, items;
    if (id === 'zelftest') {
        titel = ZELFTEST.titel;
        items = ZELFTEST.items.slice();
    } else if (id === 'eindtoets') {
        titel = 'Eindtoets';
        const pool = [];
        MODULES.forEach(m => m.items.forEach(it => { if (it.toets) pool.push({ ...it, bron: m.titel }); }));
        items = schud(pool).slice(0, 12);
    } else {
        const m = MODULES.find(x => x.id === id);
        titel = m.titel;
        items = m.items.slice();
    }
    sessie = {
        moduleId: id, titel,
        wachtrij: items.map(it => ({ ...it })),
        idx: 0,
        goed: 0,
        totaalVragen: items.filter(isVraag).length,
        fouten: []
    };
    toonItem();
}

function balkHtml() {
    const s = sessie;
    const pct = Math.round(100 * s.idx / s.wachtrij.length);
    return `
    <div class="oefen-top">
        <button class="stop" id="stop-knop">Stoppen</button>
        <div class="balk"><div style="width:${pct}%"></div></div>
        <span class="mono" style="font-size:0.76rem; color:var(--tekst-2);">${Math.min(s.idx + 1, s.wachtrij.length)}/${s.wachtrij.length}</span>
    </div>`;
}

function koppelStop() {
    document.getElementById('stop-knop').addEventListener('click', () => {
        if (confirm('Stoppen? De voortgang van deze module wordt niet opgeslagen.')) toonOverzicht();
    });
}

function labelVoor(item) {
    if (item.herhaling) return '<span class="item-label herhaal">Herhaling</span>';
    const namen = { leer: 'Leren', mc: 'Kies het juiste antwoord', meer: 'Selecteer alles wat klopt', volgorde: 'Zet in de juiste volgorde', koppel: 'Koppel de paren', sorteer: 'Sorteer', flits: 'Formuleer zelf het antwoord' };
    return `<span class="item-label">${namen[item.t] || ''}</span>`;
}

function toonItem() {
    const s = sessie;
    if (s.idx >= s.wachtrij.length) { toonKlaar(); return; }
    const item = s.wachtrij[s.idx];
    const render = { leer: renderLeer, mc: renderMc, meer: renderMeer, volgorde: renderVolgorde, koppel: renderKoppel, sorteer: renderSorteer, flits: renderFlits }[item.t];
    app.innerHTML = balkHtml() + '<div class="item-kaart" id="kaart"></div>';
    koppelStop();
    render(item, document.getElementById('kaart'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function registreer(item, wasGoed) {
    const s = sessie;
    if (isVraag(item) && !item.herhaling) {
        if (wasGoed) s.goed++;
        else {
            s.fouten.push(item.vraag);
            s.wachtrij.push({ ...item, herhaling: true });
        }
    }
}

function verderKnop(kaart) {
    const rij = document.createElement('div');
    rij.className = 'knop-rij';
    const k = document.createElement('button');
    k.className = 'knop';
    k.textContent = 'Verder';
    k.addEventListener('click', () => { sessie.idx++; toonItem(); });
    rij.appendChild(k);
    kaart.appendChild(rij);
    k.focus();
}

function feedbackBlok(kaart, ok, uitleg) {
    const f = document.createElement('div');
    f.className = 'feedback ' + (ok ? 'ok' : 'nee');
    f.innerHTML = `<div class="kop">${ok ? 'Goed!' : 'Niet helemaal.'}</div>${uitleg || ''}`;
    kaart.appendChild(f);
}

/* ---------------- renderers ---------------- */

function renderLeer(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<h3 style="font-family:'Playfair Display',serif; font-size:1.15rem; margin-bottom:10px;">${item.kop}</h3>${item.html}`;
    verderKnop(kaart);
}

function renderMc(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>`;
    const houder = document.createElement('div');
    houder.className = 'opties';
    kaart.appendChild(houder);
    const opties = schud(item.opties);
    opties.forEach(o => {
        const b = document.createElement('button');
        b.className = 'optie';
        b.innerHTML = o.tekst;
        b.addEventListener('click', () => {
            houder.querySelectorAll('.optie').forEach(x => x.disabled = true);
            const ok = !!o.goed;
            houder.querySelectorAll('.optie').forEach((x, i) => {
                if (opties[i].goed) x.classList.add(ok ? 'goed' : 'gemist');
            });
            if (!ok) b.classList.add('fout');
            else b.classList.add('goed');
            registreer(item, ok);
            feedbackBlok(kaart, ok, item.uitleg);
            verderKnop(kaart);
        });
        houder.appendChild(b);
    });
}

function renderMeer(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>`;
    const houder = document.createElement('div');
    houder.className = 'opties';
    kaart.appendChild(houder);
    const opties = schud(item.opties);
    const gekozen = new Set();
    opties.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'optie';
        b.innerHTML = o.tekst;
        b.addEventListener('click', () => {
            if (b.disabled) return;
            if (gekozen.has(i)) { gekozen.delete(i); b.classList.remove('gekozen'); }
            else { gekozen.add(i); b.classList.add('gekozen'); }
        });
        houder.appendChild(b);
    });
    const rij = document.createElement('div');
    rij.className = 'knop-rij';
    const check = document.createElement('button');
    check.className = 'knop';
    check.textContent = 'Controleer';
    check.addEventListener('click', () => {
        if (gekozen.size === 0) return;
        let ok = true;
        houder.querySelectorAll('.optie').forEach((b, i) => {
            b.disabled = true;
            b.classList.remove('gekozen');
            const moet = !!opties[i].goed, koos = gekozen.has(i);
            if (moet && koos) b.classList.add('goed');
            else if (moet && !koos) { b.classList.add('gemist'); ok = false; }
            else if (!moet && koos) { b.classList.add('fout'); ok = false; }
        });
        rij.remove();
        registreer(item, ok);
        feedbackBlok(kaart, ok, item.uitleg);
        verderKnop(kaart);
    });
    rij.appendChild(check);
    kaart.appendChild(rij);
}

function renderVolgorde(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>
        <div class="volg-lijst" id="volg-lijst"></div>
        <p class="zacht" style="margin-bottom:8px;">Tik de onderdelen aan in de juiste volgorde. Tik een geplaatst onderdeel aan om het terug te leggen.</p>
        <div class="chips" id="volg-chips"></div>`;
    const lijst = kaart.querySelector('#volg-lijst');
    const chipsDiv = kaart.querySelector('#volg-chips');
    const bron = schud(item.items.map((tekst, i) => ({ tekst, i })));
    let keuze = [];
    let klaar = false;

    const rij = document.createElement('div');
    rij.className = 'knop-rij';
    const check = document.createElement('button');
    check.className = 'knop';
    check.textContent = 'Controleer';
    check.disabled = true;
    rij.appendChild(check);
    kaart.appendChild(rij);

    function teken() {
        lijst.innerHTML = '';
        keuze.forEach((k, pos) => {
            const r = document.createElement('div');
            r.className = 'volg-rij';
            r.innerHTML = `<span class="nr">${pos + 1}</span><span>${k.tekst}</span>`;
            if (!klaar) r.addEventListener('click', () => { keuze.splice(pos, 1); teken(); });
            lijst.appendChild(r);
        });
        chipsDiv.innerHTML = '';
        bron.forEach(k => {
            if (keuze.includes(k)) return;
            const c = document.createElement('button');
            c.className = 'chip';
            c.innerHTML = k.tekst;
            c.addEventListener('click', () => { keuze.push(k); teken(); });
            chipsDiv.appendChild(c);
        });
        check.disabled = keuze.length !== item.items.length;
    }
    teken();

    check.addEventListener('click', () => {
        klaar = true;
        let ok = true;
        lijst.querySelectorAll('.volg-rij').forEach((r, pos) => {
            const juist = keuze[pos].i === pos;
            r.classList.add(juist ? 'goed' : 'fout');
            if (!juist) ok = false;
        });
        chipsDiv.remove();
        rij.remove();
        registreer(item, ok);
        const extra = ok ? '' : `<br><br><strong>Juiste volgorde:</strong><ol style="margin:6px 0 0 20px;">${item.items.map(t => `<li>${t}</li>`).join('')}</ol>`;
        feedbackBlok(kaart, ok, (item.uitleg || '') + extra);
        verderKnop(kaart);
    });
}

function renderKoppel(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>
        <div class="koppel-kolommen"><div id="kop-links"></div><div id="kop-rechts"></div></div>`;
    const linksDiv = kaart.querySelector('#kop-links');
    const rechtsDiv = kaart.querySelector('#kop-rechts');
    linksDiv.parentElement.classList.add('koppel-kolommen');
    linksDiv.classList.add('koppel-links');

    const links = item.paren.map((p, i) => ({ tekst: p[0], i }));
    const rechts = schud(item.paren.map((p, i) => ({ tekst: p[1], i })));
    let actief = null;
    let foutTeller = 0;
    let vast = 0;

    function maakChip(k, kant, houder) {
        const c = document.createElement('button');
        c.className = 'chip';
        c.innerHTML = k.tekst;
        c.dataset.i = k.i;
        c.dataset.kant = kant;
        c.addEventListener('click', () => {
            if (c.classList.contains('vast')) return;
            if (!actief) { actief = c; c.classList.add('actief'); return; }
            if (actief === c) { c.classList.remove('actief'); actief = null; return; }
            if (actief.dataset.kant === kant) {
                actief.classList.remove('actief');
                actief = c; c.classList.add('actief'); return;
            }
            if (actief.dataset.i === c.dataset.i) {
                actief.classList.remove('actief');
                actief.classList.add('vast'); c.classList.add('vast');
                actief = null; vast++;
                if (vast === item.paren.length) klaarKoppel();
            } else {
                foutTeller++;
                c.classList.add('schud'); actief.classList.add('schud');
                const a = actief;
                setTimeout(() => { c.classList.remove('schud'); a.classList.remove('schud'); a.classList.remove('actief'); }, 380);
                actief = null;
            }
        });
        houder.appendChild(c);
    }
    links.forEach(k => maakChip(k, 'L', linksDiv));
    rechts.forEach(k => maakChip(k, 'R', rechtsDiv));

    function klaarKoppel() {
        const ok = foutTeller === 0;
        registreer(item, ok);
        const extra = ok ? '' : `<br>Je had ${foutTeller} misser${foutTeller === 1 ? '' : 's'}; dit item komt straks terug.`;
        feedbackBlok(kaart, ok, (item.uitleg || '') + extra);
        verderKnop(kaart);
    }
}

function renderSorteer(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>
        <div class="sorteer-item" id="sort-item"></div>
        <div class="sorteer-knoppen" id="sort-knoppen"></div>
        <div class="sorteer-telling" id="sort-telling"></div>`;
    const itemDiv = kaart.querySelector('#sort-item');
    const knoppen = kaart.querySelector('#sort-knoppen');
    const telling = kaart.querySelector('#sort-telling');
    const volgorde = schud(item.items);
    let pos = 0, foutTeller = 0, bezig = false;

    item.cats.forEach((cat, ci) => {
        const b = document.createElement('button');
        b.className = 'optie';
        b.textContent = cat;
        b.addEventListener('click', () => {
            if (bezig || pos >= volgorde.length) return;
            bezig = true;
            const juist = volgorde[pos].cat === ci;
            if (!juist) foutTeller++;
            b.classList.add(juist ? 'goed' : 'fout');
            itemDiv.style.borderColor = juist ? 'var(--groen)' : 'var(--rood)';
            setTimeout(() => {
                b.classList.remove('goed', 'fout');
                itemDiv.style.borderColor = '';
                pos++;
                bezig = false;
                if (pos >= volgorde.length) klaarSorteer();
                else teken();
            }, juist ? 350 : 900);
        });
        knoppen.appendChild(b);
    });

    function teken() {
        itemDiv.innerHTML = volgorde[pos].tekst;
        telling.textContent = `${pos + 1}/${volgorde.length}`;
    }
    teken();

    function klaarSorteer() {
        itemDiv.remove(); knoppen.remove(); telling.remove();
        const ok = foutTeller === 0;
        registreer(item, ok);
        const extra = ok ? '' : `<br>${foutTeller} van de ${volgorde.length} ging mis; dit item komt straks terug.`;
        feedbackBlok(kaart, ok, (item.uitleg || '') + extra);
        verderKnop(kaart);
    }
}

function renderFlits(item, kaart) {
    kaart.innerHTML = `${labelVoor(item)}<div class="vraag-tekst">${item.vraag}</div>
        <p class="zacht">Zeg het antwoord hardop of schrijf het op voordat je het omdraait. Zelf ophalen werkt beter dan herlezen.</p>`;
    const rij = document.createElement('div');
    rij.className = 'knop-rij';
    const toon = document.createElement('button');
    toon.className = 'knop';
    toon.textContent = 'Toon antwoord';
    toon.addEventListener('click', () => {
        rij.remove();
        const a = document.createElement('div');
        a.className = 'flits-antwoord';
        a.innerHTML = item.antwoord;
        kaart.appendChild(a);
        const rij2 = document.createElement('div');
        rij2.className = 'knop-rij';
        const goedK = document.createElement('button');
        goedK.className = 'knop';
        goedK.textContent = 'Wist ik';
        goedK.addEventListener('click', () => { registreer(item, true); sessie.idx++; toonItem(); });
        const foutK = document.createElement('button');
        foutK.className = 'knop rustig';
        foutK.textContent = 'Nog oefenen';
        foutK.addEventListener('click', () => { registreer(item, false); sessie.idx++; toonItem(); });
        rij2.appendChild(goedK); rij2.appendChild(foutK);
        kaart.appendChild(rij2);
    });
    rij.appendChild(toon);
    kaart.appendChild(rij);
}

/* ---------------- afronding ---------------- */

function toonKlaar() {
    const s = sessie;
    const score = s.totaalVragen ? Math.round(100 * s.goed / s.totaalVragen) : 100;
    const klasse = score >= 80 ? 'top' : score >= 60 ? 'matig' : 'laag';
    const boodschap = score >= 80
        ? 'Sterk. Deze stof zit erin.'
        : score >= 60
            ? 'Goede basis; de herhaalde items verdienen nog een rondje.'
            : 'Doe deze module binnenkort nog een keer; herhaald ophalen is precies hoe het blijft hangen.';

    const v = laadVoortgang();
    const vorige = v[s.moduleId] || {};
    v[s.moduleId] = { af: true, score: Math.max(score, vorige.score || 0) };
    bewaarVoortgang(v);

    let foutenHtml = '';
    if (s.fouten.length) {
        foutenHtml = `<div class="fout-lijstje"><p class="zacht" style="margin-bottom:4px;"><strong>In &eacute;&eacute;n keer goed lukte nog niet bij:</strong></p>` +
            s.fouten.map(f => `<div class="rij"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"><path d="M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span>${f}</span></div>`).join('') +
            `</div>`;
    }

    app.innerHTML = `
    <div class="card">
        <div class="klaar-kop">
            <div style="font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:600; margin-bottom:6px;">${s.titel} afgerond</div>
            <div class="cijfer ${klasse}">${score}%</div>
            <div class="toelichting">${s.goed} van ${s.totaalVragen} vragen in &eacute;&eacute;n keer goed &middot; ${boodschap}</div>
        </div>
        ${foutenHtml}
        <div class="knop-rij" style="justify-content:center;">
            <button class="knop" id="terug-knop">Naar het overzicht</button>
            <button class="knop rustig" id="opnieuw-knop">Module opnieuw</button>
        </div>
    </div>`;
    document.getElementById('terug-knop').addEventListener('click', toonOverzicht);
    document.getElementById('opnieuw-knop').addEventListener('click', () => startModule(s.moduleId));
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

toonOverzicht();
</script>
