<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="102" fill="#0a0f0d"/>

  <!-- Medical cross / Book design -->
  <g transform="translate(256, 256)">
    <!-- Book base -->
    <path d="M-154 115h308" stroke="#2dd4a0" stroke-width="20" stroke-linecap="round"/>

    <!-- Book pages -->
    <path d="M-128 115V-77a26 26 0 0 1 26-26h204a26 26 0 0 1 26 26v192"
          fill="none" stroke="#2dd4a0" stroke-width="26" stroke-linecap="round"/>

    <!-- Text lines -->
    <line x1="-77" y1="-26" x2="77" y2="-26" stroke="#2dd4a0" stroke-width="20" stroke-linecap="round"/>
    <line x1="-77" y1="26" x2="51" y2="26" stroke="#2dd4a0" stroke-width="20" stroke-linecap="round"/>

    <!-- Medical cross accent -->
    <g transform="translate(90, -60)" opacity="0.6">
      <rect x="-15" y="-40" width="30" height="80" rx="6" fill="#2dd4a0"/>
      <rect x="-40" y="-15" width="80" height="30" rx="6" fill="#2dd4a0"/>
    </g>
  </g>

  <!-- BIUPAMA text -->
  <text x="256" y="430"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="64"
        font-weight="600"
        fill="#2dd4a0"
        text-anchor="middle">BIUPAMA</text>
</svg>
