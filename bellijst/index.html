<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bellijst</title>
<meta name="description" content="Handige telefoonnummers voor de militaire eerste lijn, met zoekfunctie. Voor persoonlijk gebruik.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e2d9cc'/><path d='M30 22c-4 0-8 4-8 8 0 26 22 48 48 48 4 0 8-4 8-8v-8c0-2-1-4-3-5l-11-5c-2-1-4 0-5 1l-4 5c-8-4-15-11-19-19l5-4c2-1 2-4 1-5l-5-11c-1-2-3-3-5-3z' fill='none' stroke='%23b45309' stroke-width='6' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #e2d9cc;
    --vlak: #ffffff;
    --vlak-zacht: #f7f3ed;
    --tekst: #2c3e36;
    --tekst-2: #6b7b6f;
    --muted: #9aa69e;
    --rand: #d5cdc2;
    --rand-licht: #e3dbd0;
    --accent: #b45309;
    --accent-donker: #92400e;
    --accent-bg: rgba(180, 83, 9, 0.08);
    --groen: #059669;
}

body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--tekst);
    line-height: 1.55;
    min-height: 100vh;
}

.wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 60px; }

.back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--tekst-2); text-decoration: none;
    font-size: 0.88rem; padding: 10px 0;
}
.back-link:hover { color: var(--accent); }
.back-link svg { width: 17px; height: 17px; }

.app-head { margin: 8px 0 16px; }
.app-head h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem; font-weight: 600;
}
.app-head .sub { color: var(--tekst-2); font-size: 0.88rem; }

.zoek-houder { position: relative; margin-bottom: 16px; }
.zoek-houder svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--muted); pointer-events: none;
}
#zoek {
    font: inherit; width: 100%;
    padding: 12px 40px 12px 42px;
    background: var(--vlak); color: var(--tekst);
    border: 1px solid var(--rand); border-radius: 12px;
}
#zoek:focus { outline: none; border-color: var(--accent); }
#zoek-wis {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font: inherit; font-size: 1.1rem; line-height: 1;
    background: none; border: none; color: var(--muted);
    padding: 6px 8px; cursor: pointer;
}
#zoek-wis:hover { color: var(--tekst); }

.kaart {
    background: var(--vlak);
    border: 1px solid var(--rand-licht);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
}
.kaart .naam { font-weight: 700; font-size: 0.98rem; }
.kaart .toelichting { color: var(--tekst-2); font-size: 0.82rem; margin-top: 1px; }

.nummer-rij {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px;
}
.nummer-rij .label {
    font-size: 0.74rem; font-weight: 600; color: var(--tekst-2);
    text-transform: uppercase; letter-spacing: 0.4px;
    width: 118px; flex-shrink: 0;
}
.nummer-rij .label:empty { display: none; }
.bel-knop {
    flex: 1; display: inline-flex; align-items: center; gap: 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem; font-weight: 700;
    color: var(--accent); text-decoration: none;
    background: var(--accent-bg);
    border: 1px solid rgba(180, 83, 9, 0.25);
    border-radius: 10px; padding: 9px 13px;
    transition: all 0.15s;
}
.bel-knop:hover { background: rgba(180, 83, 9, 0.14); }
.bel-knop svg { width: 15px; height: 15px; flex-shrink: 0; }
.kopieer {
    font: inherit; flex-shrink: 0;
    background: transparent; border: 1px solid var(--rand);
    border-radius: 10px; padding: 8px 10px; cursor: pointer;
    color: var(--tekst-2); display: flex; align-items: center;
    transition: all 0.15s;
}
.kopieer:hover { border-color: var(--accent); color: var(--accent); }
.kopieer.ok { border-color: var(--groen); color: var(--groen); }
.kopieer svg { width: 15px; height: 15px; }

.leeg {
    text-align: center; color: var(--muted);
    padding: 30px 0; font-size: 0.9rem;
}

.voet {
    text-align: center; margin-top: 30px;
    font-size: 0.78rem; color: var(--muted);
}

@media (max-width: 440px) {
    .nummer-rij { flex-wrap: wrap; }
    .nummer-rij .label { width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
    <a href="../index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Dashboard
    </a>
    <div class="app-head">
        <h1>Bellijst</h1>
        <div class="sub">Handige nummers, doorzoekbaar en direct te bellen</div>
    </div>

    <div class="zoek-houder">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="zoek" type="search" placeholder="Zoek op naam of nummer&hellip;" autocomplete="off">
        <button id="zoek-wis" aria-label="Zoekopdracht wissen" hidden>&times;</button>
    </div>

    <div id="lijst"></div>
    <div class="leeg" id="leeg" hidden>Geen nummers gevonden.</div>

    <div class="voet">Persoonlijk project, geen offici&euml;le uitgave. Controleer nummers periodiek; aan deze lijst kunnen geen rechten worden ontleend.</div>
</div>

<script>
'use strict';

const NUMMERS = [
    {
        naam: 'Duikmedisch Centrum',
        toelichting: 'Overleg duikmedische zaken',
        nummers: [
            { label: 'Binnen scheepstijd', nummer: '088 950 14 17' },
            { label: 'Binnen scheepstijd', nummer: '088 951 13 00' },
            { label: 'Buiten scheepstijd', nummer: '0223 65 82 20' }
        ]
    },
    {
        naam: 'Dienstdoende apotheker',
        toelichting: '',
        nummers: [
            { label: '', nummer: '030 250 22 69' }
        ]
    },
    {
        naam: 'Dienstdoende psychiater MGGZ',
        toelichting: '',
        nummers: [
            { label: '', nummer: '030 250 25 99' }
        ]
    }
];

const lijst = document.getElementById('lijst');
const leeg = document.getElementById('leeg');
const zoek = document.getElementById('zoek');
const zoekWis = document.getElementById('zoek-wis');

const belIcoon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
const kopieerIcoon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const vinkIcoon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

function kaal(s) { return s.toLowerCase().replace(/[\s-]/g, ''); }

function render(filter) {
    const f = (filter || '').trim().toLowerCase();
    const fKaal = kaal(f);
    lijst.innerHTML = '';
    let getoond = 0;
    NUMMERS.forEach(item => {
        const raak = !f
            || item.naam.toLowerCase().includes(f)
            || item.toelichting.toLowerCase().includes(f)
            || item.nummers.some(n => n.label.toLowerCase().includes(f) || (fKaal && kaal(n.nummer).includes(fKaal)));
        if (!raak) return;
        getoond++;
        const kaart = document.createElement('div');
        kaart.className = 'kaart';
        kaart.innerHTML = `<div class="naam">${item.naam}</div>` +
            (item.toelichting ? `<div class="toelichting">${item.toelichting}</div>` : '');
        item.nummers.forEach(n => {
            const rij = document.createElement('div');
            rij.className = 'nummer-rij';
            const telWaarde = n.nummer.replace(/\s/g, '');
            rij.innerHTML = `
                <span class="label">${n.label}</span>
                <a class="bel-knop" href="tel:${telWaarde}">${belIcoon}${n.nummer}</a>`;
            const kop = document.createElement('button');
            kop.className = 'kopieer';
            kop.setAttribute('aria-label', 'Nummer kopiëren');
            kop.innerHTML = kopieerIcoon;
            kop.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(telWaarde);
                    kop.innerHTML = vinkIcoon;
                    kop.classList.add('ok');
                    setTimeout(() => { kop.innerHTML = kopieerIcoon; kop.classList.remove('ok'); }, 1400);
                } catch (e) {
                    window.prompt('Kopieer het nummer:', telWaarde);
                }
            });
            rij.appendChild(kop);
            kaart.appendChild(rij);
        });
        lijst.appendChild(kaart);
    });
    leeg.hidden = getoond > 0;
}

zoek.addEventListener('input', () => {
    zoekWis.hidden = zoek.value === '';
    render(zoek.value);
});
zoekWis.addEventListener('click', () => {
    zoek.value = '';
    zoekWis.hidden = true;
    render('');
    zoek.focus();
});
render('');
</script>
</body>
</html>
