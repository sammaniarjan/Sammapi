<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>SNAAK COMMAND CENTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --terminal-bg: #000000;
            --terminal-green: #00ff00;
            --terminal-dim: #00aa00;
            --terminal-dark: #005500;
            --terminal-red: #ff0000;
            --terminal-yellow: #ffff00;
            --terminal-cyan: #00ffff;
            --glow: rgba(0, 255, 0, 0.5);
        }

        body {
            background: var(--terminal-bg);
            color: var(--terminal-green);
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            min-height: 100vh;
            overflow: auto;
            position: relative;
            touch-action: pan-y;
        }

        /* Scanlines effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 0, 0.02) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            animation: scanlines 0.1s linear infinite;
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        /* Terminal flicker */
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.97; }
        }

        .terminal-container {
            animation: flicker 0.15s infinite;
        }

        /* CRT curvature effect */
        .terminal-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: radial-gradient(ellipse at center, #001100 0%, #000000 100%);
        }

        /* Header HUD */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border: 2px solid var(--terminal-green);
            border-radius: 0;
            margin-bottom: 15px;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 20px var(--glow);
            font-size: 0.9rem;
        }

        .hud-title {
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .hud-stats {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--terminal-dim);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--terminal-yellow);
            text-shadow: 0 0 5px rgba(255, 255, 0, 0.5);
        }

        .rank-badge {
            padding: 5px 15px;
            border: 2px solid var(--terminal-yellow);
            background: rgba(255, 255, 0, 0.1);
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Mode selector */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            background: transparent;
            color: var(--terminal-green);
            border: 2px solid var(--terminal-green);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .mode-btn:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 15px var(--glow);
            transform: scale(1.02);
        }

        .mode-btn.active {
            background: var(--terminal-green);
            color: var(--terminal-bg);
            font-weight: bold;
            box-shadow: 0 0 20px var(--glow);
        }

        /* Main terminal screen */
        .terminal-screen {
            flex: 1;
            border: 3px solid var(--terminal-green);
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            background: rgba(0, 20, 0, 0.5);
            box-shadow: inset 0 0 50px rgba(0, 255, 0, 0.1);
            position: relative;
            -webkit-overflow-scrolling: touch;
            min-height: 300px;
        }

        .terminal-screen::-webkit-scrollbar {
            width: 10px;
        }

        .terminal-screen::-webkit-scrollbar-track {
            background: var(--terminal-dark);
        }

        .terminal-screen::-webkit-scrollbar-thumb {
            background: var(--terminal-green);
            box-shadow: 0 0 5px var(--glow);
        }

        /* Quote display */
        .quote-display {
            font-size: 1.8rem;
            line-height: 1.6;
            text-align: center;
            padding: 40px;
            text-shadow: 0 0 10px var(--glow);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quote-category {
            font-size: 0.8rem;
            color: var(--terminal-cyan);
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Battle Arena */
        .battle-arena {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 100%;
        }

        .battle-quote {
            border: 3px solid var(--terminal-green);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(0, 255, 0, 0.05);
            position: relative;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .battle-quote:hover {
            background: rgba(0, 255, 0, 0.15);
            box-shadow: 0 0 30px var(--glow);
            transform: scale(1.05);
        }

        .battle-quote.winner {
            border-color: var(--terminal-yellow);
            box-shadow: 0 0 40px rgba(255, 255, 0, 0.5);
            background: rgba(255, 255, 0, 0.1);
        }

        .battle-label {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.8rem;
            color: var(--terminal-cyan);
            letter-spacing: 1px;
        }

        .battle-text {
            font-size: 1.5rem;
            text-align: center;
            line-height: 1.5;
        }

        .battle-timer {
            margin-top: 30px;
            font-size: 3rem;
            color: var(--terminal-red);
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
        }

        /* Roast Generator */
        .roast-generator {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .roast-output {
            font-size: 2rem;
            text-align: center;
            padding: 40px;
            border: 2px solid var(--terminal-yellow);
            background: rgba(255, 255, 0, 0.05);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            background: transparent;
            color: var(--terminal-green);
            border: 2px solid var(--terminal-green);
            padding: 15px 40px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: var(--terminal-green);
            color: var(--terminal-bg);
            box-shadow: 0 0 20px var(--glow);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Quiz Mode */
        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .quiz-question {
            font-size: 1.8rem;
            text-align: center;
            padding: 30px;
            border: 2px solid var(--terminal-cyan);
            background: rgba(0, 255, 255, 0.05);
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .quiz-option {
            padding: 20px;
            border: 2px solid var(--terminal-green);
            text-align: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .quiz-option:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 15px var(--glow);
        }

        .quiz-option.correct {
            border-color: var(--terminal-yellow);
            background: rgba(255, 255, 0, 0.2);
        }

        .quiz-option.wrong {
            border-color: var(--terminal-red);
            background: rgba(255, 0, 0, 0.2);
        }

        /* Chaos Mode */
        .chaos-mode {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .chaos-quote {
            font-size: 2.5rem;
            text-align: center;
            animation: chaosFlash 0.1s;
        }

        @keyframes chaosFlash {
            0% { color: var(--terminal-red); transform: scale(1.2); }
            100% { color: var(--terminal-green); transform: scale(1); }
        }

        .chaos-counter {
            font-size: 4rem;
            color: var(--terminal-yellow);
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255, 255, 0, 0.7);
        }

        .chaos-progress {
            width: 80%;
            height: 30px;
            border: 2px solid var(--terminal-green);
            position: relative;
        }

        .chaos-progress-bar {
            height: 100%;
            background: var(--terminal-green);
            transition: width 0.3s;
            box-shadow: 0 0 20px var(--glow);
        }

        /* Leaderboard */
        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .leaderboard-entry {
            display: grid;
            grid-template-columns: 50px 1fr 150px 100px;
            gap: 20px;
            padding: 15px;
            border: 2px solid var(--terminal-green);
            background: rgba(0, 255, 0, 0.05);
            align-items: center;
        }

        .leaderboard-rank {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--terminal-yellow);
            text-align: center;
        }

        /* Control panel at bottom */
        .control-panel {
            margin-top: 15px;
            padding: 15px;
            border: 2px solid var(--terminal-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 255, 0, 0.05);
        }

        .control-btn {
            padding: 10px 30px;
            background: transparent;
            color: var(--terminal-green);
            border: 2px solid var(--terminal-green);
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: all 0.1s;
        }

        .control-btn:hover {
            background: var(--terminal-green);
            color: var(--terminal-bg);
            box-shadow: 0 0 15px var(--glow);
        }

        /* ASCII Art */
        .ascii-art {
            font-size: 0.5rem;
            line-height: 0.5rem;
            color: var(--terminal-dim);
            white-space: pre;
            text-align: center;
            margin: 20px 0;
        }

        /* Glitch effect */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glitch {
            animation: glitch 0.3s;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                overflow-x: hidden;
            }

            .terminal-container {
                padding: 10px;
                min-height: 100vh;
            }

            .hud-stats {
                gap: 10px;
                font-size: 0.75rem;
            }

            .hud-title {
                font-size: 1.1rem;
                letter-spacing: 1px;
            }

            .battle-arena {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .battle-text {
                font-size: 1.2rem;
            }

            .quiz-options {
                grid-template-columns: 1fr;
            }

            .mode-btn {
                min-width: 90px;
                font-size: 0.7rem;
                padding: 8px;
                white-space: nowrap;
            }

            .quote-display {
                font-size: 1.2rem;
                padding: 15px;
            }

            .terminal-screen {
                padding: 15px;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .roast-output {
                font-size: 1.5rem;
                padding: 20px;
            }

            .chaos-quote {
                font-size: 1.8rem;
            }

            .control-panel {
                padding: 10px;
            }

            .control-btn {
                padding: 8px 20px;
                font-size: 0.8rem;
            }
        }

        /* Boot sequence */
        .boot-sequence {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--terminal-bg);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .boot-text {
            font-size: 1.2rem;
            margin: 5px 0;
            opacity: 0;
            animation: bootLine 0.5s forwards;
        }

        @keyframes bootLine {
            to { opacity: 1; }
        }

        .boot-text:nth-child(1) { animation-delay: 0s; }
        .boot-text:nth-child(2) { animation-delay: 0.3s; }
        .boot-text:nth-child(3) { animation-delay: 0.6s; }
        .boot-text:nth-child(4) { animation-delay: 0.9s; }
        .boot-text:nth-child(5) { animation-delay: 1.2s; }
        .boot-text:nth-child(6) { animation-delay: 1.5s; }

        .hide {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Boot Sequence -->
    <div class="boot-sequence" id="boot-sequence">
        <div class="boot-text">&gt;&gt; INITIALIZING SNAAK COMMAND CENTER...</div>
        <div class="boot-text">&gt;&gt; LOADING PROTOCOL LOEMPIA...</div>
        <div class="boot-text">&gt;&gt; CONNECTING TO QUOTE ARSENAL...</div>
        <div class="boot-text">&gt;&gt; [OK] SYSTEM ONLINE</div>
        <div class="boot-text">&gt;&gt; [OK] ALL SYSTEMS OPERATIONAL</div>
        <div class="boot-text">&gt;&gt; READY TO DEPLOY. PRESS ANY KEY...</div>
    </div>

    <!-- Main Terminal -->
    <div class="terminal-container">
        <!-- HUD Header -->
        <div class="hud-header">
            <div class="hud-title">⬛ SNAAK COMMAND CENTER</div>
            <div class="hud-stats">
                <div class="stat">
                    <div class="stat-label">SCORE</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">STREAK</div>
                    <div class="stat-value" id="streak">0</div>
                </div>
                <div class="rank-badge" id="rank-badge">KOJP</div>
            </div>
        </div>

        <!-- Mode Selector -->
        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('quote', this)">📋 QUOTES</button>
            <button class="mode-btn" onclick="switchMode('battle', this)">⚔️ BATTLE</button>
            <button class="mode-btn" onclick="switchMode('roast', this)">🔥 ROAST GEN</button>
            <button class="mode-btn" onclick="switchMode('quiz', this)">❓ QUIZ</button>
            <button class="mode-btn" onclick="switchMode('chaos', this)">💀 CHAOS</button>
            <button class="mode-btn" onclick="switchMode('leaderboard', this)">🏆 RANKS</button>
        </div>

        <!-- Terminal Screen -->
        <div class="terminal-screen" id="terminal-screen">
            <!-- Content loads here -->
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div style="font-size: 0.8rem; letter-spacing: 1px;">
                PROTOCOL LOEMPIA :: <span id="system-time">00:00:00</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="control-btn" id="action-btn" onclick="handleAction()">▶ NEXT</button>
            </div>
        </div>
    </div>

    <script src="quotes.js"></script>
    <script src="config.js"></script>

    <script>
        // --- GLOBAL STATE ---
        let currentMode = 'quote';
        let playerStats = JSON.parse(localStorage.getItem('playerStats') || '{"score": 0, "streak": 0, "battles": 0, "quizzes": 0}');
        let battleState = null;
        let quizState = null;
        let chaosState = null;

        // Audio system
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        try { audioCtx = new AudioContext(); } catch (e) {}

        function playSound(type) {
            if (!audioCtx || !snaakConfig.audio.enabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const sound = snaakConfig.audio.sounds[type];
                if (!sound) return;

                const freqs = Array.isArray(sound.freq) ? sound.freq : [sound.freq];
                freqs.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(snaakConfig.audio.volume, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + sound.dur);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + sound.dur);
                    }, i * 100);
                });
            } catch (e) {}
        }

        // Unlock audio on interaction
        document.addEventListener('click', () => {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        // Boot sequence
        document.addEventListener('keydown', () => {
            const boot = document.getElementById('boot-sequence');
            if (!boot.classList.contains('hide')) {
                boot.classList.add('hide');
                playSound('click');
                init();
            }
        }, { once: true });

        document.addEventListener('click', () => {
            const boot = document.getElementById('boot-sequence');
            if (!boot.classList.contains('hide')) {
                boot.classList.add('hide');
                playSound('click');
                init();
            }
        }, { once: true });

        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('system-time').textContent = now.toLocaleTimeString('nl-NL');
        }
        setInterval(updateClock, 1000);

        // Update stats display
        function updateStatsDisplay() {
            document.getElementById('score').textContent = playerStats.score;
            document.getElementById('streak').textContent = playerStats.streak;

            // Update rank
            const ranks = Object.keys(snaakConfig.ranks).map(Number).sort((a, b) => b - a);
            const currentRank = ranks.find(threshold => playerStats.score >= threshold);
            const rankInfo = snaakConfig.ranks[currentRank];
            document.getElementById('rank-badge').textContent = rankInfo.name;
            document.getElementById('rank-badge').style.borderColor = rankInfo.color;
            document.getElementById('rank-badge').style.color = rankInfo.color;

            localStorage.setItem('playerStats', JSON.stringify(playerStats));
        }

        function addPoints(points, reason) {
            playerStats.score += points;
            updateStatsDisplay();

            // Check for rank up
            const oldRank = getCurrentRank();
            updateStatsDisplay();
            const newRank = getCurrentRank();

            if (newRank.name !== oldRank.name) {
                playSound('levelup');
                showNotification(`🎖️ RANK UP! Je bent nu ${newRank.name}!`);
            }
        }

        function getCurrentRank() {
            const ranks = Object.keys(snaakConfig.ranks).map(Number).sort((a, b) => b - a);
            const currentRank = ranks.find(threshold => playerStats.score >= threshold);
            return snaakConfig.ranks[currentRank];
        }

        function showNotification(text) {
            const notif = document.createElement('div');
            notif.textContent = text;
            notif.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                padding: 30px 50px;
                background: rgba(0, 255, 0, 0.9);
                color: #000;
                font-size: 1.5rem;
                border: 3px solid var(--terminal-yellow);
                z-index: 9998;
                animation: fadeIn 0.3s;
                text-align: center;
            `;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }

        // Mode switching
        function switchMode(mode, clickedBtn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if (clickedBtn) {
                clickedBtn.classList.add('active');
            }
            playSound('click');

            const actionBtn = document.getElementById('action-btn');

            switch(mode) {
                case 'quote':
                    actionBtn.textContent = '▶ NEXT QUOTE';
                    showQuoteMode();
                    break;
                case 'battle':
                    actionBtn.textContent = '▶ NEW BATTLE';
                    showBattleMode();
                    break;
                case 'roast':
                    actionBtn.textContent = '🔥 GENERATE';
                    showRoastMode();
                    break;
                case 'quiz':
                    actionBtn.textContent = '▶ START QUIZ';
                    showQuizMode();
                    break;
                case 'chaos':
                    actionBtn.textContent = '💀 START CHAOS';
                    showChaosMode();
                    break;
                case 'leaderboard':
                    actionBtn.textContent = '🔄 REFRESH';
                    showLeaderboard();
                    break;
            }
        }

        function handleAction() {
            playSound('click');
            switch(currentMode) {
                case 'quote':
                    showRandomQuote();
                    break;
                case 'battle':
                    startNewBattle();
                    break;
                case 'roast':
                    generateRoast();
                    break;
                case 'quiz':
                    startQuiz();
                    break;
                case 'chaos':
                    startChaos();
                    break;
                case 'leaderboard':
                    showLeaderboard();
                    break;
            }
        }

        // QUOTE MODE
        function showQuoteMode() {
            showRandomQuote();
        }

        function showRandomQuote() {
            const quote = allQuotes[Math.floor(Math.random() * allQuotes.length)];
            const category = Object.keys(snaakQuotes).find(cat =>
                snaakQuotes[cat].includes(quote)
            );

            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div class="quote-display">
                    "${quote}"
                    <div class="quote-category">// ${category.toUpperCase()}</div>
                </div>
            `;

            addPoints(snaakConfig.points.quoteView, 'quote view');
            playSound('click');
        }

        // BATTLE MODE
        function showBattleMode() {
            startNewBattle();
        }

        function startNewBattle() {
            const quote1 = allQuotes[Math.floor(Math.random() * allQuotes.length)];
            let quote2 = allQuotes[Math.floor(Math.random() * allQuotes.length)];
            while (quote2 === quote1) {
                quote2 = allQuotes[Math.floor(Math.random() * allQuotes.length)];
            }

            battleState = { quote1, quote2, timer: 8 };

            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div class="ascii-art">
╔═══════════════════════════════════════════════════════════════╗
║           QUOTE BATTLE ARENA - KIES DE HARDSTE!               ║
╚═══════════════════════════════════════════════════════════════╝
                </div>
                <div class="battle-arena">
                    <div class="battle-quote" onclick="voteBattle(1)">
                        <div class="battle-label">OPTION A</div>
                        <div class="battle-text">"${quote1}"</div>
                    </div>
                    <div class="battle-quote" onclick="voteBattle(2)">
                        <div class="battle-label">OPTION B</div>
                        <div class="battle-text">"${quote2}"</div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <div class="battle-timer" id="battle-timer">8</div>
                    <div style="margin-top: 10px; color: var(--terminal-dim);">SECONDS REMAINING</div>
                </div>
            `;

            const timerInterval = setInterval(() => {
                battleState.timer--;
                const timerEl = document.getElementById('battle-timer');
                if (timerEl) {
                    timerEl.textContent = battleState.timer;
                    if (battleState.timer <= 3) {
                        timerEl.style.color = 'var(--terminal-red)';
                        playSound('chaos');
                    }
                }

                if (battleState.timer <= 0) {
                    clearInterval(timerInterval);
                    // Auto-pick random
                    voteBattle(Math.random() > 0.5 ? 1 : 2);
                }
            }, 1000);
        }

        function voteBattle(choice) {
            if (!battleState) return;

            const winner = choice === 1 ? battleState.quote1 : battleState.quote2;
            playSound('win');
            addPoints(snaakConfig.points.battleVote, 'battle vote');

            showNotification(`✅ JE KEUZE: "${winner}"`);

            setTimeout(() => {
                startNewBattle();
            }, 1500);
        }

        // ROAST GENERATOR
        function showRoastMode() {
            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div class="roast-generator">
                    <div class="ascii-art">
╔════════════════════════════════════════════════════════════╗
║              MILITAIRE ROAST GENERATOR 3000                ║
║                GENEREER JE EIGEN ROAST                     ║
╚════════════════════════════════════════════════════════════╝
                    </div>
                    <div class="roast-output" id="roast-output">
                        Klik op GENERATE voor een verse roast
                    </div>
                    <button onclick="generateRoast()">🔥 GENERATE ROAST</button>
                </div>
            `;
        }

        function generateRoast() {
            const templates = Object.values(roastTemplates).flat();
            const template = templates[Math.floor(Math.random() * templates.length)];

            let roast = template;

            // Replace placeholders
            roast = roast.replace('{object}', pickRandom(roastComponents.objects));
            roast = roast.replace('{bodypart}', pickRandom(roastComponents.bodyparts));
            roast = roast.replace('{comparison}', pickRandom(roastComponents.comparisons));
            roast = roast.replace('{action}', pickRandom(roastComponents.actions));
            roast = roast.replace('{skill}', pickRandom(roastComponents.skills));
            roast = roast.replace('{negative_adjective}', pickRandom(roastComponents.negativeAdjectives));
            roast = roast.replace('{ridiculous_subject}', pickRandom(roastComponents.ridiculousSubjects));
            roast = roast.replace('{low_number}', Math.floor(Math.random() * 50));
            roast = roast.replace('{dumb_object}', pickRandom(roastComponents.objects));

            document.getElementById('roast-output').textContent = `"${roast}"`;
            playSound('win');
            addPoints(snaakConfig.points.roastCreate, 'roast created');
        }

        function pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // QUIZ MODE
        function showQuizMode() {
            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div style="text-align: center; padding: 60px;">
                    <div class="ascii-art">
╔═══════════════════════════════════════════════════════════╗
║                    SNAAK QUIZ MODE                        ║
║            TEST JE KENNIS VAN MILITAIRE QUOTES            ║
╚═══════════════════════════════════════════════════════════╝
                    </div>
                    <div style="margin-top: 40px; font-size: 1.5rem;">
                        Klik op START QUIZ om te beginnen
                    </div>
                </div>
            `;
        }

        function startQuiz() {
            const correctQuote = allQuotes[Math.floor(Math.random() * allQuotes.length)];
            const correctCategory = Object.keys(snaakQuotes).find(cat =>
                snaakQuotes[cat].includes(correctQuote)
            );

            // Generate wrong categories
            const categories = Object.keys(snaakQuotes).filter(cat => cat !== correctCategory);
            const wrongCategories = [];
            for (let i = 0; i < 3; i++) {
                const idx = Math.floor(Math.random() * categories.length);
                wrongCategories.push(categories[idx]);
                categories.splice(idx, 1);
            }

            const options = [correctCategory, ...wrongCategories].sort(() => Math.random() - 0.5);

            quizState = { correctCategory, correctAnswer: correctCategory };

            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div class="quiz-container">
                    <div class="quiz-question">
                        Uit welke categorie komt deze quote?<br><br>
                        "${correctQuote}"
                    </div>
                    <div class="quiz-options">
                        ${options.map(opt => `
                            <div class="quiz-option" onclick="answerQuiz('${opt}')">
                                ${opt.toUpperCase()}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function answerQuiz(answer) {
            if (!quizState) return;

            const correct = answer === quizState.correctAnswer;

            const options = document.querySelectorAll('.quiz-option');
            options.forEach(opt => {
                opt.style.pointerEvents = 'none';
                if (opt.textContent.trim().toLowerCase() === quizState.correctAnswer.toLowerCase()) {
                    opt.classList.add('correct');
                }
                if (opt.textContent.trim().toLowerCase() === answer.toLowerCase() && !correct) {
                    opt.classList.add('wrong');
                }
            });

            if (correct) {
                playSound('win');
                addPoints(snaakConfig.points.quizCorrect, 'quiz correct');
                showNotification('✅ CORRECT!');
            } else {
                playSound('lose');
                showNotification('❌ FOUT!');
            }

            setTimeout(() => {
                startQuiz();
            }, 2000);
        }

        // CHAOS MODE
        function showChaosMode() {
            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div style="text-align: center; padding: 60px;">
                    <div class="ascii-art">
╔═══════════════════════════════════════════════════════════╗
║                    ⚠️ CHAOS MODE ⚠️                       ║
║          10 QUOTES IN 20 SECONDEN - OVERLEVEN!            ║
╚═══════════════════════════════════════════════════════════╝
                    </div>
                    <div style="margin-top: 40px; font-size: 1.5rem; color: var(--terminal-red);">
                        WAARSCHUWING: RAPID FIRE QUOTES<br>
                        <div style="margin-top: 20px; color: var(--terminal-yellow);">
                            +${snaakConfig.points.chaosComplete} PUNTEN BIJ COMPLETION
                        </div>
                    </div>
                </div>
            `;
        }

        function startChaos() {
            chaosState = { count: 0, total: 10 };
            showNextChaosQuote();
        }

        function showNextChaosQuote() {
            if (chaosState.count >= chaosState.total) {
                playSound('levelup');
                addPoints(snaakConfig.points.chaosComplete, 'chaos survived');
                showNotification('🎉 CHAOS OVERLEEFD! +' + snaakConfig.points.chaosComplete + ' PUNTEN');
                setTimeout(() => showChaosMode(), 2000);
                return;
            }

            const quote = allQuotes[Math.floor(Math.random() * allQuotes.length)];
            chaosState.count++;

            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div class="chaos-mode">
                    <div class="chaos-counter">${chaosState.count}/${chaosState.total}</div>
                    <div class="chaos-progress">
                        <div class="chaos-progress-bar" style="width: ${(chaosState.count / chaosState.total) * 100}%"></div>
                    </div>
                    <div class="chaos-quote">"${quote}"</div>
                </div>
            `;

            playSound('chaos');

            setTimeout(() => showNextChaosQuote(), snaakConfig.chaos.timeBetweenQuotes);
        }

        // LEADERBOARD
        function showLeaderboard() {
            const ranks = Object.keys(snaakConfig.ranks).map(Number).sort((a, b) => a - b);

            const screen = document.getElementById('terminal-screen');
            let html = `
                <div class="ascii-art">
╔════════════════════════════════════════════════════════════╗
║                  RANK PROGRESSION TABLE                    ║
╚════════════════════════════════════════════════════════════╝
                </div>
                <div class="leaderboard">
            `;

            ranks.forEach((threshold, index) => {
                const rank = snaakConfig.ranks[threshold];
                const achieved = playerStats.score >= threshold;
                const style = achieved ? `color: ${rank.color}; opacity: 1;` : 'opacity: 0.3;';

                html += `
                    <div class="leaderboard-entry" style="${style}">
                        <div class="leaderboard-rank">#${index + 1}</div>
                        <div>${rank.name}</div>
                        <div style="color: var(--terminal-dim);">${rank.title}</div>
                        <div style="color: var(--terminal-yellow);">${threshold} pts</div>
                    </div>
                `;
            });

            html += `
                </div>
                <div style="margin-top: 30px; text-align: center; color: var(--terminal-cyan);">
                    JE HUIDIGE SCORE: ${playerStats.score} PUNTEN<br>
                    <div style="margin-top: 10px;">
                        ${getNextRankInfo()}
                    </div>
                </div>
            `;

            screen.innerHTML = html;
        }

        function getNextRankInfo() {
            const ranks = Object.keys(snaakConfig.ranks).map(Number).sort((a, b) => a - b);
            const nextRank = ranks.find(threshold => playerStats.score < threshold);
            if (!nextRank) return "🏆 MAX RANK BEREIKT!";

            const needed = nextRank - playerStats.score;
            const nextRankInfo = snaakConfig.ranks[nextRank];
            return `VOLGENDE: ${nextRankInfo.name} (${needed} punten nodig)`;
        }

        // Initialize
        function init() {
            updateStatsDisplay();
            updateClock();
            showQuoteMode();
        }
    </script>
</body>
</html>
