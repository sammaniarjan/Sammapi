<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>SNAAK COMMAND CENTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --terminal-bg: #000000;
            --terminal-green: #00ff00;
            --terminal-dim: #00aa00;
            --terminal-dark: #005500;
            --terminal-red: #ff0000;
            --terminal-yellow: #ffff00;
            --terminal-cyan: #00ffff;
            --glow: rgba(0, 255, 0, 0.5);
        }

        body {
            background: var(--terminal-bg);
            color: var(--terminal-green);
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            min-height: 100vh;
            overflow: auto;
            position: relative;
            touch-action: pan-y;
        }

        /* Scanlines effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 0, 0.02) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            animation: scanlines 0.1s linear infinite;
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        /* Terminal flicker */
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.97; }
        }

        .terminal-container {
            animation: flicker 0.15s infinite;
        }

        /* CRT curvature effect */
        .terminal-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: radial-gradient(ellipse at center, #001100 0%, #000000 100%);
        }

        /* Header HUD */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border: 2px solid var(--terminal-green);
            border-radius: 0;
            margin-bottom: 15px;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 20px var(--glow);
            font-size: 0.9rem;
        }

        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 2px solid var(--terminal-green);
            background: transparent;
            color: var(--terminal-green);
            text-decoration: none;
            margin-right: 15px;
            transition: all 0.1s;
        }

        .home-btn:hover {
            background: var(--terminal-green);
            color: var(--terminal-bg);
            box-shadow: 0 0 15px var(--glow);
        }

        .hud-title {
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .hud-stats {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--terminal-dim);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--terminal-yellow);
            text-shadow: 0 0 5px rgba(255, 255, 0, 0.5);
        }

        .rank-badge {
            padding: 5px 15px;
            border: 2px solid var(--terminal-yellow);
            background: rgba(255, 255, 0, 0.1);
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Mode selector */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            background: transparent;
            color: var(--terminal-green);
            border: 2px solid var(--terminal-green);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .mode-btn:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 15px var(--glow);
            transform: scale(1.02);
        }

        .mode-btn.active {
            background: var(--terminal-green);
            color: var(--terminal-bg);
            font-weight: bold;
            box-shadow: 0 0 20px var(--glow);
        }

        /* Main terminal screen */
        .terminal-screen {
            flex: 1;
            border: 3px solid var(--terminal-green);
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            background: rgba(0, 20, 0, 0.5);
            box-shadow: inset 0 0 50px rgba(0, 255, 0, 0.1);
            position: relative;
            -webkit-overflow-scrolling: touch;
            min-height: 300px;
        }

        .terminal-screen::-webkit-scrollbar {
            width: 10px;
        }

        .terminal-screen::-webkit-scrollbar-track {
            background: var(--terminal-dark);
        }

        .terminal-screen::-webkit-scrollbar-thumb {
            background: var(--terminal-green);
            box-shadow: 0 0 5px var(--glow);
        }

        /* Quote display */
        .quote-display {
            font-size: 1.8rem;
            line-height: 1.6;
            text-align: center;
            padding: 40px;
            text-shadow: 0 0 10px var(--glow);
            animation: fadeIn 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            height: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quote-category {
            font-size: 0.8rem;
            color: var(--terminal-cyan);
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Pong Game */
        .pong-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 20px;
        }

        .pong-canvas {
            border: 3px solid var(--terminal-green);
            box-shadow: 0 0 30px var(--glow);
            background: #001100;
        }

        .pong-scores {
            display: flex;
            gap: 60px;
            font-size: 2rem;
            color: var(--terminal-yellow);
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        }

        .pong-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .pong-score-label {
            font-size: 0.9rem;
            color: var(--terminal-cyan);
            letter-spacing: 1px;
        }

        .pong-controls {
            display: flex;
            gap: 40px;
            font-size: 0.8rem;
            color: var(--terminal-dim);
            text-align: center;
        }

        .pong-winner {
            font-size: 2rem;
            color: var(--terminal-yellow);
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.7);
            animation: pulse 1s infinite;
        }

        /* Roast Generator */
        .roast-generator {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .roast-output {
            font-size: 2rem;
            text-align: center;
            padding: 40px;
            border: 2px solid var(--terminal-yellow);
            background: rgba(255, 255, 0, 0.05);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            background: transparent;
            color: var(--terminal-green);
            border: 2px solid var(--terminal-green);
            padding: 15px 40px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: var(--terminal-green);
            color: var(--terminal-bg);
            box-shadow: 0 0 20px var(--glow);
        }

        button:active {
            transform: scale(0.95);
        }


        /* Leaderboard */
        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .leaderboard-entry {
            display: grid;
            grid-template-columns: 50px 1fr 150px 100px;
            gap: 20px;
            padding: 15px;
            border: 2px solid var(--terminal-green);
            background: rgba(0, 255, 0, 0.05);
            align-items: center;
        }

        .leaderboard-rank {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--terminal-yellow);
            text-align: center;
        }

        /* Control panel at bottom */
        .control-panel {
            margin-top: 15px;
            padding: 15px;
            border: 2px solid var(--terminal-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 255, 0, 0.05);
        }

        .control-btn {
            padding: 10px 30px;
            background: transparent;
            color: var(--terminal-green);
            border: 2px solid var(--terminal-green);
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: all 0.1s;
        }

        .control-btn:hover {
            background: var(--terminal-green);
            color: var(--terminal-bg);
            box-shadow: 0 0 15px var(--glow);
        }

        /* Mode Header */
        .mode-header {
            text-align: center;
            margin: 20px 0;
            padding: 15px 20px;
            border: 2px solid var(--terminal-green);
            background: rgba(0, 255, 0, 0.05);
        }

        .mode-header h2 {
            font-size: 1.5rem;
            color: var(--terminal-green);
            text-shadow: 0 0 10px var(--glow);
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        .mode-header p {
            font-size: 0.9rem;
            color: var(--terminal-dim);
            margin: 0;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .mode-header h2 {
                font-size: 1.2rem;
            }
            .mode-header p {
                font-size: 0.8rem;
            }
        }

        /* Glitch effect */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glitch {
            animation: glitch 0.3s;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                overflow-x: hidden;
            }

            .terminal-container {
                padding: 10px;
                min-height: 100vh;
            }

            .hud-stats {
                gap: 10px;
                font-size: 0.75rem;
            }

            .hud-title {
                font-size: 1.1rem;
                letter-spacing: 1px;
            }


            .mode-btn {
                min-width: 90px;
                font-size: 0.7rem;
                padding: 8px;
                white-space: nowrap;
            }

            .quote-display {
                font-size: 1.2rem;
                padding: 15px;
            }

            .terminal-screen {
                padding: 15px;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .roast-output {
                font-size: 1.5rem;
                padding: 20px;
            }

            .chaos-quote {
                font-size: 1.8rem;
            }

            .control-panel {
                padding: 10px;
            }

            .control-btn {
                padding: 8px 20px;
                font-size: 0.8rem;
            }
        }

        /* Boot sequence */
        .boot-sequence {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--terminal-bg);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .boot-text {
            font-size: 1.2rem;
            margin: 5px 0;
            opacity: 0;
            animation: bootLine 0.5s forwards;
        }

        @keyframes bootLine {
            to { opacity: 1; }
        }

        .boot-text:nth-child(1) { animation-delay: 0s; }
        .boot-text:nth-child(2) { animation-delay: 0.3s; }
        .boot-text:nth-child(3) { animation-delay: 0.6s; }
        .boot-text:nth-child(4) { animation-delay: 0.9s; }
        .boot-text:nth-child(5) { animation-delay: 1.2s; }
        .boot-text:nth-child(6) { animation-delay: 1.5s; }

        .hide {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Boot Sequence -->
    <div class="boot-sequence" id="boot-sequence">
        <div class="boot-text">&gt;&gt; INITIALIZING SNAAK COMMAND CENTER...</div>
        <div class="boot-text">&gt;&gt; LOADING PROTOCOL LOEMPIA...</div>
        <div class="boot-text">&gt;&gt; CONNECTING TO QUOTE ARSENAL...</div>
        <div class="boot-text">&gt;&gt; [OK] SYSTEM ONLINE</div>
        <div class="boot-text">&gt;&gt; [OK] ALL SYSTEMS OPERATIONAL</div>
        <div class="boot-text">&gt;&gt; READY TO DEPLOY. PRESS ANY KEY...</div>
    </div>

    <!-- Main Terminal -->
    <div class="terminal-container">
        <!-- HUD Header -->
        <div class="hud-header">
            <div style="display: flex; align-items: center;">
                <a href="../index.html" class="home-btn" title="Terug naar AMA Hub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </a>
                <div class="hud-title">⬛ SNAAK COMMAND CENTER</div>
            </div>
            <div class="hud-stats">
                <div class="stat">
                    <div class="stat-label">SCORE</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">STREAK</div>
                    <div class="stat-value" id="streak">0</div>
                </div>
                <div class="rank-badge" id="rank-badge">KOJP</div>
            </div>
        </div>

        <!-- Mode Selector -->
        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('quote', this)">📋 QUOTES</button>
            <button class="mode-btn" onclick="switchMode('pong', this)">🏓 PONG</button>
            <button class="mode-btn" onclick="switchMode('roast', this)">🔥 ROAST GEN</button>
            <button class="mode-btn" onclick="switchMode('invaders', this)">👾 INVADERS</button>
            <button class="mode-btn" onclick="switchMode('snake', this)">🐍 SNAKE</button>
            <button class="mode-btn" onclick="switchMode('leaderboard', this)">🏆 RANKS</button>
        </div>

        <!-- Terminal Screen -->
        <div class="terminal-screen" id="terminal-screen">
            <!-- Content loads here -->
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div style="font-size: 0.8rem; letter-spacing: 1px;">
                PROTOCOL LOEMPIA :: <span id="system-time">00:00:00</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="control-btn" id="action-btn" onclick="handleAction()">▶ NEXT</button>
            </div>
        </div>
    </div>

    <script src="quotes.js"></script>
    <script src="config.js"></script>

    <script>
        // --- GLOBAL STATE ---
        let currentMode = 'quote';
        let playerStats = JSON.parse(localStorage.getItem('playerStats') || '{"score": 0, "streak": 0, "battles": 0, "quizzes": 0}');
        let pongState = null;
        let invadersState = null;
        let snakeState = null;

        // Audio system
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        try { audioCtx = new AudioContext(); } catch (e) {}

        function playSound(type) {
            if (!audioCtx || !snaakConfig.audio.enabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const sound = snaakConfig.audio.sounds[type];
                if (!sound) return;

                const freqs = Array.isArray(sound.freq) ? sound.freq : [sound.freq];
                freqs.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(snaakConfig.audio.volume, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + sound.dur);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + sound.dur);
                    }, i * 100);
                });
            } catch (e) {}
        }

        // Unlock audio on interaction
        document.addEventListener('click', () => {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        // Boot sequence
        document.addEventListener('keydown', () => {
            const boot = document.getElementById('boot-sequence');
            if (!boot.classList.contains('hide')) {
                boot.classList.add('hide');
                playSound('click');
                init();
            }
        }, { once: true });

        document.addEventListener('click', () => {
            const boot = document.getElementById('boot-sequence');
            if (!boot.classList.contains('hide')) {
                boot.classList.add('hide');
                playSound('click');
                init();
            }
        }, { once: true });

        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('system-time').textContent = now.toLocaleTimeString('nl-NL');
        }
        setInterval(updateClock, 1000);

        // Update stats display
        function updateStatsDisplay() {
            document.getElementById('score').textContent = playerStats.score;
            document.getElementById('streak').textContent = playerStats.streak;

            // Update rank
            const ranks = Object.keys(snaakConfig.ranks).map(Number).sort((a, b) => b - a);
            const currentRank = ranks.find(threshold => playerStats.score >= threshold);
            const rankInfo = snaakConfig.ranks[currentRank];
            document.getElementById('rank-badge').textContent = rankInfo.name;
            document.getElementById('rank-badge').style.borderColor = rankInfo.color;
            document.getElementById('rank-badge').style.color = rankInfo.color;

            localStorage.setItem('playerStats', JSON.stringify(playerStats));
        }

        function addPoints(points, reason) {
            playerStats.score += points;
            updateStatsDisplay();

            // Check for rank up
            const oldRank = getCurrentRank();
            updateStatsDisplay();
            const newRank = getCurrentRank();

            if (newRank.name !== oldRank.name) {
                playSound('levelup');
                showNotification(`🎖️ RANK UP! Je bent nu ${newRank.name}!`);
            }
        }

        function getCurrentRank() {
            const ranks = Object.keys(snaakConfig.ranks).map(Number).sort((a, b) => b - a);
            const currentRank = ranks.find(threshold => playerStats.score >= threshold);
            return snaakConfig.ranks[currentRank];
        }

        function showNotification(text) {
            const notif = document.createElement('div');
            notif.textContent = text;
            notif.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                padding: 30px 50px;
                background: rgba(0, 255, 0, 0.9);
                color: #000;
                font-size: 1.5rem;
                border: 3px solid var(--terminal-yellow);
                z-index: 9998;
                animation: fadeIn 0.3s;
                text-align: center;
            `;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }

        // Mode switching
        function switchMode(mode, clickedBtn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if (clickedBtn) {
                clickedBtn.classList.add('active');
            }
            playSound('click');

            const actionBtn = document.getElementById('action-btn');

            switch(mode) {
                case 'quote':
                    actionBtn.textContent = '▶ NEXT QUOTE';
                    showQuoteMode();
                    break;
                case 'pong':
                    actionBtn.textContent = '▶ START PONG';
                    showPongMode();
                    break;
                case 'roast':
                    actionBtn.textContent = '🔥 GENERATE';
                    showRoastMode();
                    break;
                case 'invaders':
                    actionBtn.textContent = '👾 START GAME';
                    showInvadersMode();
                    break;
                case 'snake':
                    actionBtn.textContent = '🐍 START GAME';
                    showSnakeMode();
                    break;
                case 'leaderboard':
                    actionBtn.textContent = '🔄 REFRESH';
                    showLeaderboard();
                    break;
            }
        }

        function handleAction() {
            playSound('click');
            switch(currentMode) {
                case 'quote':
                    showRandomQuote();
                    break;
                case 'pong':
                    startPongGame();
                    break;
                case 'roast':
                    generateRoast();
                    break;
                case 'invaders':
                    startInvadersGame();
                    break;
                case 'snake':
                    startSnakeGame();
                    break;
                case 'leaderboard':
                    showLeaderboard();
                    break;
            }
        }

        // QUOTE MODE
        function showQuoteMode() {
            showRandomQuote();
        }

        function showRandomQuote() {
            const quote = allQuotes[Math.floor(Math.random() * allQuotes.length)];
            const category = Object.keys(snaakQuotes).find(cat =>
                snaakQuotes[cat].includes(quote)
            );

            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div class="quote-display">
                    "${quote}"
                    <div class="quote-category">// ${category.toUpperCase()}</div>
                </div>
            `;

            addPoints(snaakConfig.points.quoteView, 'quote view');
            playSound('click');
        }

        // PONG MODE
        function showPongMode() {
            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div class="pong-container">
                    <div class="mode-header">
                        <h2>SNAAK PONG - 2 SPELERS</h2>
                        <p>EERSTE TOT 5 PUNTEN WINT!</p>
                    </div>
                    <div class="pong-controls">
                        <div>SPELER 1<br>W = OMHOOG<br>S = OMLAAG</div>
                        <div>SPELER 2<br>↑ = OMHOOG<br>↓ = OMLAAG</div>
                    </div>
                    <div style="margin-top: 20px; font-size: 1.2rem;">
                        Klik op START PONG om te beginnen
                    </div>
                </div>
            `;
        }

        function startPongGame() {
            if (pongState && pongState.running) {
                stopPongGame();
            }

            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div class="pong-container">
                    <div class="pong-scores">
                        <div class="pong-score">
                            <div class="pong-score-label">SPELER 1</div>
                            <div id="pong-score1">0</div>
                        </div>
                        <div class="pong-score">
                            <div class="pong-score-label">SPELER 2</div>
                            <div id="pong-score2">0</div>
                        </div>
                    </div>
                    <canvas id="pong-canvas" class="pong-canvas" width="600" height="400"></canvas>
                    <div class="pong-controls">
                        <div>W/S</div>
                        <div>↑/↓</div>
                    </div>
                </div>
            `;

            const canvas = document.getElementById('pong-canvas');
            const ctx = canvas.getContext('2d');

            pongState = {
                running: true,
                score1: 0,
                score2: 0,
                winScore: 5,
                paddleHeight: 80,
                paddleWidth: 10,
                ballSize: 10,
                paddle1Y: 160,
                paddle2Y: 160,
                ballX: 300,
                ballY: 200,
                ballSpeedX: 5,
                ballSpeedY: 3,
                paddleSpeed: 8,
                keys: {}
            };

            // Keyboard handlers
            pongState.keyDownHandler = (e) => {
                pongState.keys[e.key] = true;
                if (['w', 's', 'W', 'S', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                    e.preventDefault();
                }
            };
            pongState.keyUpHandler = (e) => {
                pongState.keys[e.key] = false;
            };

            document.addEventListener('keydown', pongState.keyDownHandler);
            document.addEventListener('keyup', pongState.keyUpHandler);

            function gameLoop() {
                if (!pongState || !pongState.running) return;

                // Move paddles
                if (pongState.keys['w'] || pongState.keys['W']) {
                    pongState.paddle1Y = Math.max(0, pongState.paddle1Y - pongState.paddleSpeed);
                }
                if (pongState.keys['s'] || pongState.keys['S']) {
                    pongState.paddle1Y = Math.min(canvas.height - pongState.paddleHeight, pongState.paddle1Y + pongState.paddleSpeed);
                }
                if (pongState.keys['ArrowUp']) {
                    pongState.paddle2Y = Math.max(0, pongState.paddle2Y - pongState.paddleSpeed);
                }
                if (pongState.keys['ArrowDown']) {
                    pongState.paddle2Y = Math.min(canvas.height - pongState.paddleHeight, pongState.paddle2Y + pongState.paddleSpeed);
                }

                // Move ball
                pongState.ballX += pongState.ballSpeedX;
                pongState.ballY += pongState.ballSpeedY;

                // Ball collision with top/bottom
                if (pongState.ballY <= 0 || pongState.ballY >= canvas.height - pongState.ballSize) {
                    pongState.ballSpeedY = -pongState.ballSpeedY;
                    playSound('click');
                }

                // Ball collision with paddles
                // Left paddle
                if (pongState.ballX <= pongState.paddleWidth + 20 &&
                    pongState.ballY + pongState.ballSize >= pongState.paddle1Y &&
                    pongState.ballY <= pongState.paddle1Y + pongState.paddleHeight &&
                    pongState.ballSpeedX < 0) {
                    pongState.ballSpeedX = -pongState.ballSpeedX * 1.05;
                    playSound('click');
                }
                // Right paddle
                if (pongState.ballX >= canvas.width - pongState.paddleWidth - 20 - pongState.ballSize &&
                    pongState.ballY + pongState.ballSize >= pongState.paddle2Y &&
                    pongState.ballY <= pongState.paddle2Y + pongState.paddleHeight &&
                    pongState.ballSpeedX > 0) {
                    pongState.ballSpeedX = -pongState.ballSpeedX * 1.05;
                    playSound('click');
                }

                // Score
                if (pongState.ballX <= 0) {
                    pongState.score2++;
                    document.getElementById('pong-score2').textContent = pongState.score2;
                    playSound('win');
                    resetBall(1);
                }
                if (pongState.ballX >= canvas.width) {
                    pongState.score1++;
                    document.getElementById('pong-score1').textContent = pongState.score1;
                    playSound('win');
                    resetBall(-1);
                }

                // Check for winner
                if (pongState.score1 >= pongState.winScore || pongState.score2 >= pongState.winScore) {
                    endPongGame();
                    return;
                }

                // Draw
                ctx.fillStyle = '#001100';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Center line
                ctx.strokeStyle = '#005500';
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, 0);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);

                // Paddles
                ctx.fillStyle = '#00ff00';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ff00';
                ctx.fillRect(10, pongState.paddle1Y, pongState.paddleWidth, pongState.paddleHeight);
                ctx.fillRect(canvas.width - pongState.paddleWidth - 10, pongState.paddle2Y, pongState.paddleWidth, pongState.paddleHeight);

                // Ball
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(pongState.ballX, pongState.ballY, pongState.ballSize, pongState.ballSize);

                ctx.shadowBlur = 0;

                pongState.animationFrame = requestAnimationFrame(gameLoop);
            }

            function resetBall(direction) {
                pongState.ballX = canvas.width / 2;
                pongState.ballY = canvas.height / 2;
                pongState.ballSpeedX = 5 * direction;
                pongState.ballSpeedY = (Math.random() - 0.5) * 6;
            }

            function endPongGame() {
                pongState.running = false;
                const winner = pongState.score1 >= pongState.winScore ? 1 : 2;
                playSound('levelup');
                addPoints(10, 'pong win');

                screen.innerHTML = `
                    <div class="pong-container">
                        <div class="mode-header">
                            <h2>GAME OVER!</h2>
                        </div>
                        <div class="pong-winner">
                            SPELER ${winner} WINT!
                        </div>
                        <div style="margin-top: 20px; font-size: 1.5rem;">
                            ${pongState.score1} - ${pongState.score2}
                        </div>
                        <div style="margin-top: 10px; color: var(--terminal-yellow);">
                            +10 PUNTEN!
                        </div>
                        <div style="margin-top: 30px; color: var(--terminal-dim);">
                            Klik op START PONG voor een nieuwe game
                        </div>
                    </div>
                `;

                document.removeEventListener('keydown', pongState.keyDownHandler);
                document.removeEventListener('keyup', pongState.keyUpHandler);
            }

            gameLoop();
        }

        function stopPongGame() {
            if (pongState) {
                pongState.running = false;
                if (pongState.animationFrame) {
                    cancelAnimationFrame(pongState.animationFrame);
                }
                if (pongState.keyDownHandler) {
                    document.removeEventListener('keydown', pongState.keyDownHandler);

                    document.removeEventListener('keyup', pongState.keyUpHandler);

                bullets: [],
                enemies: [],
                enemyBullets: [],
                enemyDirection: 1,
                enemySpeed: 1,
                lastEnemyShot: 0,
                keys: {}
            };

            // Create enemies
            function createEnemies() {
                invadersState.enemies = [];
                for (let row = 0; row < 4; row++) {
                    for (let col = 0; col < 8; col++) {
                        invadersState.enemies.push({
                            x: 60 + col * 60,
                            y: 40 + row * 40,
                            width: 30,
                            height: 20,
                            alive: true
                        });
                    }
                }
            }
            createEnemies();

            // Keyboard handlers
            invadersState.keyDownHandler = (e) => {
                invadersState.keys[e.key] = true;
                if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                    e.preventDefault();
                }
                // Shoot
                if (e.key === ' ' && invadersState.running) {
                    const now = Date.now();
                    if (!invadersState.lastShot || now - invadersState.lastShot > 120) {
                        invadersState.bullets.push({
                            x: invadersState.player.x + invadersState.player.width / 2 - 2,
                            y: invadersState.player.y,
                            width: 4,
                            height: 10,
                            speed: 8
                        });
                        invadersState.lastShot = now;
                        playSound('click');
                    }
                }
            };
            invadersState.keyUpHandler = (e) => {
                invadersState.keys[e.key] = false;
            };

            document.addEventListener('keydown', invadersState.keyDownHandler);
            document.addEventListener('keyup', invadersState.keyUpHandler);

            function gameLoop() {
                if (!invadersState || !invadersState.running) return;

                // Move player
                if (invadersState.keys['ArrowLeft']) {
                    invadersState.player.x = Math.max(0, invadersState.player.x - invadersState.player.speed);
                }
                if (invadersState.keys['ArrowRight']) {
                    invadersState.player.x = Math.min(canvas.width - invadersState.player.width, invadersState.player.x + invadersState.player.speed);
                }

                // Move bullets
                invadersState.bullets = invadersState.bullets.filter(b => {
                    b.y -= b.speed;
                    return b.y > 0;
                });

                // Move enemy bullets
                invadersState.enemyBullets = invadersState.enemyBullets.filter(b => {
                    b.y += b.speed;
                    return b.y < canvas.height;
                });

                // Move enemies
                let hitEdge = false;
                const aliveEnemies = invadersState.enemies.filter(e => e.alive);
                aliveEnemies.forEach(enemy => {
                    enemy.x += invadersState.enemyDirection * invadersState.enemySpeed;
                    if (enemy.x <= 0 || enemy.x + enemy.width >= canvas.width) {
                        hitEdge = true;
                    }
                });

                if (hitEdge) {
                    invadersState.enemyDirection *= -1;
                    aliveEnemies.forEach(enemy => {
                        enemy.y += 15;
                    });
                }

                // Enemy shooting
                const now = Date.now();
                if (now - invadersState.lastEnemyShot > 1500 && aliveEnemies.length > 0) {
                    const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
                    invadersState.enemyBullets.push({
                        x: shooter.x + shooter.width / 2 - 2,
                        y: shooter.y + shooter.height,
                        width: 4,
                        height: 10,
                        speed: 4
                    });
                    invadersState.lastEnemyShot = now;
                }

                // Check bullet-enemy collisions
                invadersState.bullets.forEach(bullet => {
                    invadersState.enemies.forEach(enemy => {
                        if (enemy.alive &&
                            bullet.x < enemy.x + enemy.width &&
                            bullet.x + bullet.width > enemy.x &&
                            bullet.y < enemy.y + enemy.height &&
                            bullet.y + bullet.height > enemy.y) {
                            enemy.alive = false;
                            bullet.y = -100;
                            invadersState.score += 10;
                            document.getElementById('invaders-score').textContent = invadersState.score;
                            playSound('win');
                        }
                    });
                });

                // Check enemy bullet-player collisions
                invadersState.enemyBullets.forEach(bullet => {
                    if (bullet.x < invadersState.player.x + invadersState.player.width &&
                        bullet.x + bullet.width > invadersState.player.x &&
                        bullet.y < invadersState.player.y + invadersState.player.height &&
                        bullet.y + bullet.height > invadersState.player.y) {
                        bullet.y = 1000;
                        invadersState.lives--;
                        document.getElementById('invaders-lives').textContent = invadersState.lives;
                        playSound('lose');
                        if (invadersState.lives <= 0) {
                            endInvadersGame(false);
                            return;
                        }
                    }
                });

                // Check if enemies reached bottom
                aliveEnemies.forEach(enemy => {
                    if (enemy.y + enemy.height >= invadersState.player.y) {
                        endInvadersGame(false);
                        return;
                    }
                });

                // Check win condition
                if (aliveEnemies.length === 0) {
                    invadersState.level++;
                    document.getElementById('invaders-level').textContent = invadersState.level;
                    invadersState.enemySpeed += 0.5;
                    createEnemies();
                    playSound('levelup');
                }

                // Draw
                ctx.fillStyle = '#001100';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw player
                ctx.fillStyle = '#00ff00';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ff00';
                ctx.fillRect(invadersState.player.x, invadersState.player.y, invadersState.player.width, invadersState.player.height);
                // Player cannon
                ctx.fillRect(invadersState.player.x + invadersState.player.width/2 - 3, invadersState.player.y - 8, 6, 8);

                // Draw enemies
                ctx.fillStyle = '#ff0000';
                ctx.shadowColor = '#ff0000';
                invadersState.enemies.forEach(enemy => {
                    if (enemy.alive) {
                        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                        // Enemy eyes
                        ctx.fillStyle = '#001100';
                        ctx.fillRect(enemy.x + 5, enemy.y + 5, 6, 6);
                        ctx.fillRect(enemy.x + enemy.width - 11, enemy.y + 5, 6, 6);
                        ctx.fillStyle = '#ff0000';
                    }
                });

                // Draw bullets
                ctx.fillStyle = '#00ff00';
                ctx.shadowColor = '#00ff00';
                invadersState.bullets.forEach(bullet => {
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                });

                // Draw enemy bullets
                ctx.fillStyle = '#ff0000';
                ctx.shadowColor = '#ff0000';
                invadersState.enemyBullets.forEach(bullet => {
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                });

                ctx.shadowBlur = 0;

                invadersState.animationFrame = requestAnimationFrame(gameLoop);
            }

            function endInvadersGame(won) {
                invadersState.running = false;
                const finalScore = invadersState.score;

                if (won || finalScore > 50) {

        function startSnakeGame() {
            if (snakeState && snakeState.running) {
                stopSnakeGame();
            }

            const screen = document.getElementById('terminal-screen');
            screen.innerHTML = `
                <div class="pong-container">
                    <div class="pong-scores">
                        <div class="pong-score">
                            <div class="pong-score-label">SCORE</div>
                            <div id="snake-score">0</div>
                        </div>
                        <div class="pong-score">
                            <div class="pong-score-label">LENGTE</div>
                            <div id="snake-length">3</div>
                        </div>
                    </div>
                    <canvas id="snake-canvas" class="pong-canvas" width="600" height="400"></canvas>
                    <div class="pong-controls">
                        <div>← ↑ → ↓ BEWEGEN</div>
                    </div>
                </div>
            `;

            const canvas = document.getElementById('snake-canvas');
            const ctx = canvas.getContext('2d');
            const gridSize = 20;
            const gridWidth = canvas.width / gridSize;
            const gridHeight = canvas.height / gridSize;

            snakeState = {
                running: true,
                score: 0,
                snake: [
                    { x: 15, y: 10 },
                    { x: 14, y: 10 },
                    { x: 13, y: 10 }
                ],
                direction: { x: 1, y: 0 },
                nextDirection: { x: 1, y: 0 },
                food: { x: 20, y: 10 },
                speed: 100,
                lastMove: 0
            };

            // Place food
            function placeFood() {
                do {
                    snakeState.food = {
                        x: Math.floor(Math.random() * gridWidth),
                        y: Math.floor(Math.random() * gridHeight)
                    };
                } while (snakeState.snake.some(s => s.x === snakeState.food.x && s.y === snakeState.food.y));
            }
            placeFood();

            // Keyboard handler
            snakeState.keyDownHandler = (e) => {
                const key = e.key;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
                    e.preventDefault();
                }
                if (key === 'ArrowUp' && snakeState.direction.y !== 1) {
                    snakeState.nextDirection = { x: 0, y: -1 };
                } else if (key === 'ArrowDown' && snakeState.direction.y !== -1) {
                    snakeState.nextDirection = { x: 0, y: 1 };
                } else if (key === 'ArrowLeft' && snakeState.direction.x !== 1) {
                    snakeState.nextDirection = { x: -1, y: 0 };
                } else if (key === 'ArrowRight' && snakeState.direction.x !== -1) {
                    snakeState.nextDirection = { x: 1, y: 0 };
                }
            };

            document.addEventListener('keydown', snakeState.keyDownHandler);

            function gameLoop(timestamp) {
                if (!snakeState || !snakeState.running) return;

                if (timestamp - snakeState.lastMove >= snakeState.speed) {
                    snakeState.lastMove = timestamp;
                    snakeState.direction = snakeState.nextDirection;

                    // Move snake
                    const head = {
                        x: snakeState.snake[0].x + snakeState.direction.x,
                        y: snakeState.snake[0].y + snakeState.direction.y
                    };

                    // Check wall collision
                    if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                        endSnakeGame();
                        return;
                    }

                    // Check self collision
                    if (snakeState.snake.some(s => s.x === head.x && s.y === head.y)) {
                        endSnakeGame();
                        return;
                    }

                    snakeState.snake.unshift(head);

                    // Check food
                    if (head.x === snakeState.food.x && head.y === snakeState.food.y) {
                        snakeState.score += 10;
                        document.getElementById('snake-score').textContent = snakeState.score;
                        document.getElementById('snake-length').textContent = snakeState.snake.length;
                        playSound('win');
                        placeFood();
                        // Speed up slightly
                        snakeState.speed = Math.max(50, snakeState.speed - 2);
                    } else {
                        snakeState.snake.pop();
                    }
                }

                // Draw
                ctx.fillStyle = '#001100';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw grid
                ctx.strokeStyle = '#003300';
                for (let x = 0; x < gridWidth; x++) {
                    ctx.beginPath();
                    ctx.moveTo(x * gridSize, 0);
                    ctx.lineTo(x * gridSize, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y < gridHeight; y++) {
                    ctx.beginPath();
                    ctx.moveTo(0, y * gridSize);
                    ctx.lineTo(canvas.width, y * gridSize);
                    ctx.stroke();
                }

                // Draw food
                ctx.fillStyle = '#ffff00';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffff00';
                ctx.fillRect(snakeState.food.x * gridSize + 2, snakeState.food.y * gridSize + 2, gridSize - 4, gridSize - 4);

                // Draw snake
                ctx.fillStyle = '#00ff00';
                ctx.shadowColor = '#00ff00';
                snakeState.snake.forEach((segment, index) => {
                    const brightness = Math.max(0.4, 1 - index * 0.05);
                    ctx.fillStyle = `rgba(0, ${Math.floor(255 * brightness)}, 0, 1)`;
                    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
                });

                // Draw head eyes
                const head = snakeState.snake[0];
                ctx.fillStyle = '#001100';
                ctx.fillRect(head.x * gridSize + 4, head.y * gridSize + 4, 4, 4);
                ctx.fillRect(head.x * gridSize + gridSize - 8, head.y * gridSize + 4, 4, 4);

                ctx.shadowBlur = 0;

                snakeState.animationFrame = requestAnimationFrame(gameLoop);
            }

            function endSnakeGame() {
                snakeState.running = false;
                const finalScore = snakeState.score;
                const finalLength = snakeState.snake.length;

                playSound('lose');
                if (finalScore > 0) {
                    addPoints(finalScore, 'snake score');
                }

                // Get random roast
                const roast = allQuotes[Math.floor(Math.random() * allQuotes.length)];

                screen.innerHTML = `
                    <div class="pong-container">
                        <div class="mode-header">
                            <h2>GAME OVER!</h2>
                        </div>
                        <div class="pong-winner">
                            SCORE: ${finalScore}
                        </div>
                        <div style="margin-top: 10px; font-size: 1.2rem; color: var(--terminal-cyan);">
                            LENGTE: ${finalLength}
                        </div>
                        <div style="margin-top: 20px; font-size: 1rem; color: var(--terminal-yellow);">
                            +${finalScore} PUNTEN!
                        </div>
                        <div style="margin-top: 30px; padding: 20px; border: 2px solid var(--terminal-red); background: rgba(255,0,0,0.1);">
                            <div style="color: var(--terminal-red); margin-bottom: 10px;">ROAST:</div>
                            <div style="font-size: 1.2rem;">"${roast}"</div>
                        </div>
                        <div style="margin-top: 20px; color: var(--terminal-dim);">
                            Klik op START GAME voor een nieuwe poging
                        </div>
                    </div>
                `;

                document.removeEventListener('keydown', snakeState.keyDownHandler);
            }

            requestAnimationFrame(gameLoop);
        }

        function stopSnakeGame() {
            if (snakeState) {
                snakeState.running = false;
                if (snakeState.animationFrame) {
                    cancelAnimationFrame(snakeState.animationFrame);
                }
                if (snakeState.keyDownHandler) {
                    document.removeEventListener('keydown', snakeState.keyDownHandler);
                }
            }
        }

        // LEADERBOARD
        function showLeaderboard() {
            const ranks = Object.keys(snaakConfig.ranks).map(Number).sort((a, b) => a - b);

            const screen = document.getElementById('terminal-screen');
            let html = `
                <div class="mode-header">
                    <h2>RANK PROGRESSION TABLE</h2>
                    <p>KLIM OP IN DE RANGEN!</p>
                </div>
                <div class="leaderboard">
            `;

            ranks.forEach((threshold, index) => {
                const rank = snaakConfig.ranks[threshold];
                const achieved = playerStats.score >= threshold;
                const style = achieved ? `color: ${rank.color}; opacity: 1;` : 'opacity: 0.3;';

                html += `
                    <div class="leaderboard-entry" style="${style}">
                        <div class="leaderboard-rank">#${index + 1}</div>
                        <div>${rank.name}</div>
                        <div style="color: var(--terminal-dim);">${rank.title}</div>
                        <div style="color: var(--terminal-yellow);">${threshold} pts</div>
                    </div>
                `;
            });

            html += `
                </div>
                <div style="margin-top: 30px; text-align: center; color: var(--terminal-cyan);">
                    JE HUIDIGE SCORE: ${playerStats.score} PUNTEN<br>
                    <div style="margin-top: 10px;">
                        ${getNextRankInfo()}
                    </div>
                </div>
            `;

            screen.innerHTML = html;
        }

        function getNextRankInfo() {
            const ranks = Object.keys(snaakConfig.ranks).map(Number).sort((a, b) => a - b);
            const nextRank = ranks.find(threshold => playerStats.score < threshold);
            if (!nextRank) return "🏆 MAX RANK BEREIKT!";

            const needed = nextRank - playerStats.score;
            const nextRankInfo = snaakConfig.ranks[nextRank];
            return `VOLGENDE: ${nextRankInfo.name} (${needed} punten nodig)`;
        }

        // Initialize
        function init() {
            updateStatsDisplay();
            updateClock();
            showQuoteMode();
        }
    </script>
</body>
</html>
